sel=m;tc.attach(m);sbx.setFromObject(m);sbx.visible=true;mode='edit';syncMode();
};
if(ext=='gltf'||ext=='glb'){new THREE.GLTFLoader().load(url,g=>loadGeo(g.scene.children[0].geometry))}
else if(ext=='obj'){new THREE.OBJLoader().load(url,o=>loadGeo(o.children[0].geometry))}
};

/* JSON export view */
$('#imp').onclick=()=>{
const data={seed,wl,biome,season,heights:Array.from(H),MI:Array.from(MI)};
$('#exp').value=JSON.stringify(data);$('#ov').hidden=false;
};
$('#cp').onclick=()=>{navigator.clipboard.writeText($('#exp').value);$('#ovt').textContent='Copied to Clipboard!'};
$('#cl').onclick=()=>$('#ov').hidden=true;

/* initialization & main render loop */
gen();scatter(0);updSky();renderUI();syncMode();
let fCount=0,fTime=performance.now();

function animate(t){
requestAnimationFrame(animate);
const dt=(t-fTime)/1000;fTime=t;
fCount++;if(fCount%15==0)$('#fps').textContent=Math.round(1/dt)+' FPS';

WU.value=t*0.001*wspd;
U.t.value=t*0.001;
clouds.forEach(c=>{c.position.x+=dt*wspd*2;if(c.position.x>250)c.position.x=-250});

oc.update();
ren.render(scene,cam);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
ren.setSize(innerWidth,innerHeight);
});
</script>
</body>
