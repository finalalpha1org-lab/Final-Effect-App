<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--pn:rgba(20,26,34,.95);--ink:#e8eef5;--mu:#8b9bb0;--ac:#3ddc97;--on:#04160e;--ln:rgba(255,255,255,.12);--ch:#222c38}}

#top{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;pointer-events:none;z-index:20}
#top>*{pointer-events:auto}

.pill{background:var(--pn);border:1px solid var(--ln);border-radius:999px;display:flex;overflow:hidden}

:root{--bg:#a3a3a3;--pn:rgba(196,196,196,.97);--ink:#1a1a1a;--mu:#4d4d4d;--ac:#4772b3;--on:#fff;--ln:rgba(0,0,0,.35);--ch:#d9d9d9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1d;--pn:rgba(48,48,48,.97);--ink:#e6e6e6;--mu:#9d9d9d;--ac:#4772b3;--on:#fff;--ln:#111;--ch:#545454}}
:root[data-theme="dark"]{--bg:#1d1d1d;--pn:rgba(48,48,48,.97);--ink:#e6e6e6;--mu:#9d9d9d;--ac:#4772b3;--on:#fff;--ln:#111;--ch:#545454}

.sl input[type=number]{width:100%;box-sizing:border-box;background:var(--ch);color:var(--ink);border:1px solid var(--ln);border-radius:4px;padding:4px 6px;font:inherit}
#dr>*{flex:none}.row{flex:none}.lg{display:none}@media(min-width:640px){.lg{display:inline}}

<script>
/* =========================================================================
   Final Effect 3D Terrain Studio — Pure Babylon.js Architecture
   ========================================================================= */
function showErr(t){let b=document.getElementById('err');if(!b){b=document.createElement('div');b.id='err';b.style.cssText='position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:30;background:#7a1f1f;color:#fff;padding:8px 10px;border-radius:8px;font:12px/1.35 system-ui;white-space:pre-wrap;word-break:break-word';b.onclick=()=>b.remove();document.body.appendChild(b)}b.textContent+=(b.textContent?'\n':'')+t}
addEventListener('error',e=>showErr('Error: '+e.message+' (line '+e.lineno+')'));
const $=s=>document.querySelector(s),R=Math.random,cl=(v,a,b)=>Math.min(b,Math.max(a,v)),mx=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const S=100,N=128,D=S/N,W=N+1,cv=$('#c');
let tab='terrain',mode='render',nav=false,place=null,sel=null,seed=1,wl=0,tod=15,az=40,cov=.5,fogD=.004,wspd=1,wp=0,fl=0;
const br={tool:'raise',r:6,str:.5,tex:0,kind:'grass',den:10},objs=[];

// 1. BABYLON.JS ENGINE & SCENE
const engine=new BABYLON.Engine(cv, true, {preserveDrawingBuffer:true, stencil:true, antialias:true, powerPreference:'high-performance'}, true);
engine.setHardwareScalingLevel(Math.min(1.5, 1 / (window.devicePixelRatio || 1)));
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(0.24, 0.24, 0.24, 1);
scene.ambientColor=new BABYLON.Color3(0.5, 0.5, 0.5);

// Camera
const cam=new BABYLON.ArcRotateCamera("Camera", -Math.PI*0.35, Math.PI*0.35, 110, new BABYLON.Vector3(0, 4, 0), scene);
cam.attachControl(cv, true);
cam.wheelPrecision=25; cam.lowerRadiusLimit=5; cam.upperRadiusLimit=360;
let ortho=false;

// Lighting & Shadows
const hemi=new BABYLON.HemisphericLight("HemiLight", new BABYLON.Vector3(0, 1, 0), scene);
hemi.intensity=0.8;
hemi.diffuse=new BABYLON.Color3(0.85, 0.92, 1.0);
hemi.groundColor=new BABYLON.Color3(0.35, 0.32, 0.28);

const sun=new BABYLON.DirectionalLight("SunLight", new BABYLON.Vector3(-0.5, -0.85, 0.4), scene);
sun.position=new BABYLON.Vector3(60, 120, 60);
sun.intensity=1.8;
sun.diffuse=new BABYLON.Color3(1.0, 0.95, 0.85);
sun.shadowEnabled=true;

let shadow;
try {
  shadow=new BABYLON.ShadowGenerator(2048, sun);
  shadow.usePercentageCloserFiltering=true;
  shadow.filteringQuality=BABYLON.ShadowGenerator.QUALITY_MEDIUM;
  shadow.bias=0.0005;
  shadow.normalBias=0.005;
} catch(e){
  console.log('Shadow init:', e);
}

// Fog & ACES Tone Mapping
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity=fogD;
scene.fogColor=new BABYLON.Color3(0.74, 0.82, 0.90);
scene.imageProcessingConfiguration.toneMappingEnabled=true;
scene.imageProcessingConfiguration.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
scene.imageProcessingConfiguration.exposure=1.1;

// Grid Ground Lines Helper
const gridLines = [];
for(let i=-100; i<=100; i+=20){
  gridLines.push([new BABYLON.Vector3(i, 0.05, -100), new BABYLON.Vector3(i, 0.05, 100)]);
  gridLines.push([new BABYLON.Vector3(-100, 0.05, i), new BABYLON.Vector3(100, 0.05, i)]);
}
const gridMesh = BABYLON.MeshBuilder.CreateLineSystem("GridHelper", { lines: gridLines }, scene);
gridMesh.color = new BABYLON.Color3(0.3, 0.3, 0.3);
gridMesh.isPickable = false;

// X and Z Axis Guide Lines
const axisX = BABYLON.MeshBuilder.CreateLines("AxisX", { points: [new BABYLON.Vector3(-100, 0.06, 0), new BABYLON.Vector3(100, 0.06, 0)] }, scene);
axisX.color = new BABYLON.Color3(1, 0.2, 0.32); axisX.isPickable = false;
const axisZ = BABYLON.MeshBuilder.CreateLines("AxisZ", { points: [new BABYLON.Vector3(0, 0.06, -100), new BABYLON.Vector3(0, 0.06, 100)] }, scene);
axisZ.color = new BABYLON.Color3(0.55, 0.86, 0); axisZ.isPickable = false;

// Selection Bounding Box Helper
const sbx = BABYLON.MeshBuilder.CreateBox("SelBox", { size: 1 }, scene);
sbx.material = new BABYLON.StandardMaterial("sbxMat", scene);
sbx.material.wireframe = true;
sbx.material.emissiveColor = new BABYLON.Color3(1, 0.65, 0.25);
sbx.material.disableLighting = true;
sbx.setEnabled(false); sbx.isPickable = false;

// Sky Dome
const skyDome = BABYLON.MeshBuilder.CreateSphere("SkyDome", { diameter: 800, segments: 16 }, scene);
const skyMat = new BABYLON.StandardMaterial("SkyMat", scene);
skyMat.backFaceCulling = false;
skyMat.disableLighting = true;
skyDome.material = skyMat;
skyDome.isPickable = false;

// Water Plane
const water = BABYLON.MeshBuilder.CreateGround("WaterPlane", { width: 260, height: 260, subdivisions: 64 }, scene);
water.position.y = wl;
water.isPickable = false;

function createWaterBumpTexture(){
  const res = 256, cv = document.createElement('canvas'); cv.width = cv.height = res;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(res, res);
  for(let y=0; y<res; y++){
    for(let x=0; x<res; x++){
      const idx = (y*res + x)*4;
      const nx = Math.sin(x*0.12) * Math.cos(y*0.08) + Math.sin((x+y)*0.09)*0.5;
      const ny = Math.cos(x*0.09) * Math.sin(y*0.12) + Math.cos((x-y)*0.09)*0.5;
      img.data[idx] = Math.floor((nx*0.5 + 0.5)*255);
      img.data[idx+1] = Math.floor((ny*0.5 + 0.5)*255);
      img.data[idx+2] = 255;
      img.data[idx+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new BABYLON.Texture(cv.toDataURL(), scene);
  tex.uScale = 8; tex.vScale = 8;
  return tex;
}

let waterMat;
try {
  waterMat = new BABYLON.WaterMaterial("WaterMat", scene, new BABYLON.Vector2(512, 512));
  waterMat.bumpTexture = createWaterBumpTexture();
  waterMat.windForce = 35;
  waterMat.waveHeight = 0.35;
  waterMat.waveLength = 0.18;
  waterMat.bumpHeight = 0.8;
  waterMat.waterColor = new BABYLON.Color3(0.04, 0.35, 0.58);
  waterMat.colorBlendFactor = 0.25;
  water.material = waterMat;
} catch(e) {
  const pbrW = new BABYLON.PBRMaterial("FallbackWater", scene);
  pbrW.albedoColor = new BABYLON.Color3(0.04, 0.35, 0.58);
  pbrW.roughness = 0.05; pbrW.metallic = 0.1; pbrW.alpha = 0.88;
  pbrW.bumpTexture = createWaterBumpTexture();
  water.material = pbrW;
}

const WP = [
  [[0.02, 0.12, 0.25], [0.04, 0.35, 0.58]],
  [[0.02, 0.30, 0.35], [0.06, 0.65, 0.75]],
  [[0.10, 0.14, 0.08], [0.18, 0.32, 0.22]]
];
function setWater(i){
  wp = i;
  if(waterMat && waterMat.waterColor){
    waterMat.waterColor = new BABYLON.Color3(...WP[i][1]);
  }
}
setWater(0);

// Clouds
const clouds = [];
const cloudTexCanvas = document.createElement('canvas'); cloudTexCanvas.width = cloudTexCanvas.height = 64;
const cx = cloudTexCanvas.getContext('2d');
const cGr = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
cGr.addColorStop(0, 'rgba(255,255,255,.9)'); cGr.addColorStop(1, 'rgba(255,255,255,0)');
cx.fillStyle = cGr; cx.fillRect(0, 0, 64, 64);
const cloudTex = new BABYLON.DynamicTexture("cloudTex", cloudTexCanvas, scene, false);
cloudTex.hasAlpha = true;

const cloudMat = new BABYLON.StandardMaterial("cloudMat", scene);
cloudMat.diffuseTexture = cloudTex;
cloudMat.opacityTexture = cloudTex;
cloudMat.disableLighting = true;
cloudMat.backFaceCulling = false;

for(let i=0; i<14; i++){
  const g = new BABYLON.TransformNode("CloudGroup_" + i, scene);
  g.position.set((R()-0.5)*500, 70+R()*40, (R()-0.5)*500);
  for(let k=0; k<7; k++){
    const s = BABYLON.MeshBuilder.CreatePlane("CloudSprite", { width: 40+R()*30, height: 22+R()*10 }, scene);
    s.material = cloudMat;
    s.position.set((R()-0.5)*50, R()*6, (R()-0.5)*20);
    s.billboardMode = BABYLON.Mesh.BILLBOARDMODE_Y;
    s.parent = g;
    s.isPickable = false;
  }
  clouds.push(g);
}

// 2. TERRAIN PROCEDURAL DATA & GENERATION
const H = new Float32Array(W*W), MI = new Uint8Array(W*W).fill(255);
let biome = 'hills', hs = 34, rockT = 1.3, snowL = 16, veg = 1;
const BIO = {
  hills:  { p: [[.26,.52,.16],[.44,.32,.18],[.38,.36,.34],[.78,.70,.50],[.94,.96,.99]], s: 18, rT: 1.2, v: 1.0, rough: 0.86 },
  alpine: { p: [[.28,.36,.22],[.36,.32,.26],[.20,.22,.26],[.60,.58,.54],[.97,.98,1.0]], s: 12, rT: 0.95, v: 0.5, rough: 0.88 },
  desert: { p: [[.82,.70,.48],[.65,.42,.24],[.58,.34,.18],[.88,.80,.58],[.86,.80,.70]], s: 24, rT: 1.4, v: 0.08, rough: 0.85 },
  volc:   { p: [[.10,.10,.11],[.14,.13,.13],[.08,.08,.09],[.06,.06,.07],[.18,.17,.18]], s: 22, rT: 0.85, v: 0.03, rough: 0.94 }
};
const PAL = [];

function hash(x, y){ const s = Math.sin(x*127.1 + y*311.7 + seed)*43758.5453; return s - Math.floor(s); }
function vn(x, y){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx*fx*(3 - 2*fx), v = fy*fy*(3 - 2*fy);
  return hash(ix, iy)*(1-u)*(1-v) + hash(ix+1, iy)*u*(1-v) + hash(ix, iy+1)*(1-u)*v + hash(ix+1, iy+1)*u*v;
}
const mx3 = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const sm = (a,b,x) => { const t = cl((x-a)/(b-a), 0, 1); return t*t*(3-2*t); };
const slopeAt = (i, j) => {
  const h = H[j*W + i];
  return Math.abs(H[Math.min(j+1, N)*W + i] - h) + Math.abs(H[j*W + Math.min(i+1, N)] - h);
};
function mIdx(i, j){
  const k = j*W + i, h = H[k];
  if(MI[k] != 255) return MI[k];
  return h < wl + 0.9 ? 3 : h > snowL ? 4 : slopeAt(i, j) > rockT ? 2 : h > 11 ? 1 : 0;
}
function col(i, j){
  const k = j*W + i, h = H[k], sl = slopeAt(i, j);
  let c;
  if(MI[k] != 255) c = PAL[MI[k]];
  else if(biome === 'alpine'){
    // Alpine: Crystalline pure white snow on high summits and flat plateaus, sharp dark jagged granite on steep cliff faces
    const cliff = sm(rockT - 0.25, rockT + 0.35, sl);
    const snowCover = sm(snowL - 1.5, snowL + 2.0, h) * (1.0 - sm(rockT - 0.1, rockT + 0.45, sl) * 0.85);
    const graniteRock = mx3([.22,.24,.28], [.16,.17,.20], sm(rockT + 0.2, rockT + 1.2, sl));
    const tundraGround = mx3(PAL[0], PAL[1], sm(6, 12, h));
    c = mx3(tundraGround, graniteRock, cliff);
    c = mx3(c, PAL[4], snowCover);
    c = mx3(PAL[3], c, sm(wl + 0.4, wl + 1.2, h));
  } else if(biome === 'volc'){
    // Volcanic: Dark basalt rock, cooled obsidian crust, and porous ash. High roughness ~0.94, zero shine
    const cliff = sm(rockT - 0.25, rockT + 0.3, sl);
    const ashBase = mx3([.10,.10,.11], [.13,.12,.12], hash(i, j*3)*0.4);
    const basaltRock = mx3([.08,.08,.09], [.16,.14,.14], cliff);
    c = mx3(ashBase, basaltRock, cliff);
    c = mx3(c, [.20,.18,.19], sm(snowL, snowL + 3.0, h) * 0.6); // cooled volcanic pumice crest
    c = mx3([.06,.06,.07], c, sm(wl + 0.3, wl + 1.0, h)); // shoreline volcanic black sand
  } else if(biome === 'desert'){
    // Desert: Golden rippled sand dunes, sandstone canyon walls
    const cliff = sm(rockT - 0.3, rockT + 0.3, sl);
    const duneSand = mx3(PAL[0], PAL[3], sm(2, 10, h));
    const canyonRock = mx3(PAL[1], PAL[2], cliff);
    c = mx3(duneSand, canyonRock, cliff);
  } else {
    // Hills: Lush meadow soil blending into granite cliffs
    c = mx3(PAL[0], PAL[1], sm(9, 13, h));
    c = mx3(c, PAL[2], sm(rockT - 0.35, rockT + 0.35, sl));
    c = mx3(c, PAL[4], sm(snowL, snowL + 2.5, h) * (1 - sm(rockT - 0.2, rockT + 0.6, sl) * 0.7));
    c = mx3(PAL[3], c, sm(wl + 0.5, wl + 1.4, h));
  }
  const v = biome === 'volc' ? 0.92 + 0.15 * hash(i, j*7) : 0.85 + 0.3 * hash(i, j*7);
  return [c[0]*v, c[1]*v, c[2]*v];
}

function hgt(x, z){
  const u = cl((x + S/2)/D, 0, N - 0.001), v = cl((z + S/2)/D, 0, N - 0.001);
  const i = u|0, j = v|0, a = u - i, b = v - j, k = j*W + i;
  return H[k]*(1-a)*(1-b) + H[k+1]*a*(1-b) + H[k+W]*(1-a)*b + H[k+W+1]*a*b;
}

// Terrain Material (PBR with Procedural Normal Bump Map tailored to active biome)
function mkNormal(bKey = 'hills'){
  const n = 128, c = document.createElement('canvas'); c.width = c.height = n;
  const x = c.getContext('2d'), d = x.createImageData(n, n);
  const g = new Float32Array(n*n);
  for(let i=0; i<n*n; i++){
    if(bKey === 'volc') g[i] = R() > 0.82 ? R() * 0.4 : R() * 0.15; // porous micro-cavities
    else if(bKey === 'alpine') g[i] = R() * 0.25 + Math.sin(i * 0.2) * 0.08; // jagged stratified rock
    else if(bKey === 'desert') g[i] = Math.sin((i%n)*0.18) * 0.12 + R() * 0.06; // sand ripples
    else g[i] = R() * 0.2;
  }
  const G = (a, b) => g[((b+n)%n)*n + ((a+n)%n)];
  for(let y=0; y<n; y++) for(let i=0; i<n; i++){
    const nx = -(G(i+1, y) - G(i-1, y))*2.8, ny = -(G(i, y+1) - G(i, y-1))*2.8;
    const l = Math.hypot(nx, ny, 1), k = (y*n + i)*4;
    d.data[k] = (nx/l*0.5 + 0.5)*255;
    d.data[k+1] = (ny/l*0.5 + 0.5)*255;
    d.data[k+2] = (1/l)*255;
    d.data[k+3] = 255;
  }
  x.putImageData(d, 0, 0);
  const t = new BABYLON.Texture(c.toDataURL(), scene);
  t.uScale = t.vScale = (bKey === 'volc' ? 48 : 36);
  return t;
}

function setBiome(b, init){

let ter = null;
function upd(x0=0, x1=N, z0=0, z1=N){
  if(ter) ter.dispose();
  const positions = [], indices = [], colors = [], uvs = [];

  for(let j=0; j<=N; j++){
    for(let i=0; i<=N; i++){
      const k = j*W + i, x = i*D - S/2, z = j*D - S/2, h = H[k];
      positions.push(x, h, z);
      uvs.push(i/N, j/N);
      const c = col(i, j);
      colors.push(c[0], c[1], c[2], 1.0);
    }
  }

  for(let j=0; j<N; j++){
    for(let i=0; i<N; i++){
      const a = j*W + i, b = a + 1, c = a + W, d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }

  // Analytical Normals
  const normals = new Float32Array((N+1)*(N+1)*3);
  for(let j=0; j<=N; j++){
    for(let i=0; i<=N; i++){
      const k = j*W + i;
      const iL = Math.max(0, i-1), iR = Math.min(N, i+1);
      const jD = Math.max(0, j-1), jU = Math.min(N, j+1);
      const dx = (iR - iL)*D, dz = (jU - jD)*D;
      const dhdx = (H[j*W + iR] - H[j*W + iL]) / dx;
      const dhdz = (H[jU*W + i] - H[jD*W + i]) / dz;
      let nx = -dhdx, ny = 1.0, nz = -dhdz;
      const len = Math.hypot(nx, ny, nz) || 1;
      normals[k*3] = nx/len; normals[k*3+1] = ny/len; normals[k*3+2] = nz/len;
    }
  }

  const vd = new BABYLON.VertexData();
  vd.positions = positions; vd.indices = indices; vd.colors = colors; vd.normals = normals; vd.uvs = uvs;

  ter = new BABYLON.Mesh("TerrainMesh", scene);
  vd.applyToMesh(ter, true);
  ter.material = tm;
  ter.receiveShadows = true;
  ter.isPickable = true;

  if(shadow) shadow.addShadowCaster(ter);
  if(waterMat) waterMat.renderList = [ter];
}

function gen(){
  seed = R()*100;
  MI.fill(255);
  for(let j=0; j<W; j++){
    for(let i=0; i<W; i++){
      const x = i*D - S/2, z = j*D - S/2;
      let n = 0, a = 0.5, f = 0.035;
      for(let o=0; o<4; o++){
        n += vn(x*f + o*17, z*f)*a;
        a /= 2; f *= 2;
      }
      const r = Math.hypot(x, z) / (S/2);
      H[j*W + i] = (n - 0.45)*hs - r*r*9 + 2;
    }
  }
  upd();
}

function bump(x, z, v){
  const u = cl((x + S/2)/D, 0, N - 0.001), w = cl((z + S/2)/D, 0, N - 0.001);
  const i = u|0, j = w|0, a = u - i, b = w - j, k = j*W + i;
  H[k] += v*(1-a)*(1-b); H[k+1] += v*a*(1-b); H[k+W] += v*(1-a)*b; H[k+W+1] += v*a*b;
}

function erode(p){
  const n = Math.round(30 + 90*br.str);
  for(let q=0; q<n; q++){
    const a = R()*6.283, d = Math.sqrt(R())*br.r;
    let x = p.x + Math.cos(a)*d, z = p.z + Math.sin(a)*d, vx = 0, vz = 0, sed = 0, sp = 1;
    for(let t=0; t<32; t++){
      if(Math.abs(x) > S/2 - D*2 || Math.abs(z) > S/2 - D*2) break;
      const h0 = hgt(x, z);
      const gx = (hgt(x+D, z) - hgt(x-D, z)) / (2*D);
      const gz = (hgt(x, z+D) - hgt(x, z-D)) / (2*D);
      vx = vx*0.5 - gx; vz = vz*0.5 - gz;
      const l = Math.hypot(vx, vz);
      if(l < 1e-4) break;
      vx /= l; vz /= l;
      const nx = x + vx*D, nz = z + vz*D, dh = hgt(nx, nz) - h0;
      const cap = Math.max(-dh, 0.03)*sp*6;
      if(sed > cap || dh > 0){
        const m = dh > 0 ? Math.min(dh, sed) : (sed - cap)*0.3;
        bump(x, z, m); sed -= m;
      } else {
        const m = Math.min((cap - sed)*0.3, -dh);
        bump(x, z, -m*0.5); sed += m*0.5;
      }
      sp = Math.sqrt(Math.max(sp*sp - dh*2, 0.05));
      x = nx; z = nz;
    }
  }
}

function sculpt(p, dt){
  if(br.tool == 'erode'){ erode(p); upd(); return; }
  const r = br.r;
  const x0 = Math.max(0, Math.floor((p.x + S/2 - r)/D));
  const x1 = Math.min(N, Math.ceil((p.x + S/2 + r)/D));
  const z0 = Math.max(0, Math.floor((p.z + S/2 - r)/D));
  const z1 = Math.min(N, Math.ceil((p.z + S/2 + r)/D));
  const src = br.tool == 'smooth' ? H.slice() : null;

  for(let j=z0; j<=z1; j++){
    for(let i=x0; i<=x1; i++){
      const d = Math.hypot(i*D - S/2 - p.x, j*D - S/2 - p.z) / r;
      if(d >= 1) continue;
      const f = (1 - d*d)**2, k = j*W + i;
      switch(br.tool){
        case 'raise': H[k] += br.str*f*dt*10; break;
        case 'lower': H[k] -= br.str*f*dt*10; break;
        case 'flat':  H[k] += (fl - H[k])*Math.min(1, f*dt*10*br.str); break;
        case 'smooth': {
          const a = (src[k - (i>0)] + src[k + (i<N)] + src[k - (j>0)*W] + src[k + (j<N)*W])/4;
          H[k] += (a - H[k])*Math.min(1, f*dt*14*br.str);
          break;
        }
        case 'terrace': H[k] += (Math.round(H[k]/3)*3 - H[k])*Math.min(1, f*dt*10*br.str); break;
        case 'paint': if(f > 0.2) MI[k] = br.tex; break;
      }
    }
  }
  upd(Math.max(0, x0-1), Math.min(N, x1+1), Math.max(0, z0-1), Math.min(N, z1+1));
}

function createProceduralBarkTexture(species){
  const res = 512, cv = document.createElement('canvas'); cv.width = cv.height = res;
  const ctx = cv.getContext('2d');
  
  if(species === 'oak'){
    ctx.fillStyle = "#2c1d11"; ctx.fillRect(0, 0, res, res);
    for(let i=0; i<3500; i++){
      ctx.fillStyle = Math.random() > 0.5 ? "#190f07" : Math.random() > 0.5 ? "#3d2817" : "#4a321d";
      const x = Math.random() * res, y = Math.random() * res;
      ctx.fillRect(x, y, Math.random()*3 + 1, Math.random()*50 + 15);
    }
    // Deep vertical furrow crevices
    ctx.fillStyle = "rgba(15, 8, 4, 0.4)";
    for(let i=0; i<30; i++){
      const gx = Math.random() * res;
      ctx.fillRect(gx, 0, Math.random()*4 + 2, res);
    }
  } else if(species === 'pine'){
    ctx.fillStyle = "#3e2417"; ctx.fillRect(0, 0, res, res);
    for(let i=0; i<2500; i++){
      ctx.fillStyle = Math.random() > 0.5 ? "#24120a" : Math.random() > 0.5 ? "#55311e" : "#683d26";
      const x = Math.random() * res, y = Math.random() * res;
      ctx.fillRect(x, y, Math.random()*12 + 4, Math.random()*18 + 6);
    }
  } else if(species === 'birch'){
    ctx.fillStyle = "#e5e8e3"; ctx.fillRect(0, 0, res, res);
    // Subtle beige-gray gradient undertones
    for(let i=0; i<1500; i++){
      ctx.fillStyle = "rgba(180, 175, 165, 0.15)";
      ctx.fillRect(Math.random()*res, Math.random()*res, Math.random()*20+5, Math.random()*4+1);
    }
    // Horizontal dark lenticels & peeling paper bark
    for(let i=0; i<120; i++){
      ctx.fillStyle = Math.random() > 0.4 ? "#18181a" : "#383633";
      const x = Math.random() * res, y = Math.random() * res;
      ctx.fillRect(x, y, Math.random()*45 + 12, Math.random()*3 + 1.5);
    }
  } else if(species === 'palm'){
    ctx.fillStyle = "#4a3d31"; ctx.fillRect(0, 0, res, res);
    for(let y=0; y<res; y+=18){
      ctx.fillStyle = "rgba(25, 18, 12, 0.6)";
      ctx.fillRect(0, y, res, 4);

    ctx.fillStyle = "#35281e"; ctx.fillRect(0, 0, res, res);

      ctx.fillStyle = Math.random() > 0.5 ? "#1f150e" : "#4a392b";
      ctx.fillRect(Math.random()*res, Math.random()*res, Math.random()*3+1, Math.random()*25+5);
    }
  }
  const tex = new BABYLON.DynamicTexture(species + "_BarkTex", cv, scene, true);
  tex.uScale = 1; tex.vScale = (species === 'birch' ? 4 : 3);
  return tex;
}

function createProceduralLeafTexture(species){
  const res = 512, cv = document.createElement('canvas'); cv.width = cv.height = res;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, res, res);

  if(species === 'oak' || species === 'shrub'){
    // Clustered realistic broadleaf sprigs with veins
    const count = 38;
    for(let i=0; i<count; i++){
      const cx = res/2 + (Math.random()-0.5)*320, cy = res/2 + (Math.random()-0.5)*320;
      const rot = Math.random()*Math.PI*2, len = Math.random()*45 + 50, wid = len * 0.55;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      
      // Leaf Body
      ctx.beginPath();
      ctx.moveTo(0, -len/2);
      ctx.bezierCurveTo(wid, -len*0.2, wid*0.8, len*0.3, 0, len/2);
      ctx.bezierCurveTo(-wid*0.8, len*0.3, -wid, -len*0.2, 0, -len/2);
      ctx.fillStyle = species === 'shrub' 
        ? (Math.random() > 0.5 ? "#326e1e" : "#458a28") 
        : (Math.random() > 0.5 ? "#245818" : Math.random() > 0.5 ? "#317420" : "#428d2a");
      ctx.fill();

      // Center Vein
      ctx.strokeStyle = "rgba(160, 220, 110, 0.45)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -len/2); ctx.lineTo(0, len/2); ctx.stroke();
      ctx.restore();
    }
  } else if(species === 'pine'){
    // Dense radiating conifer pine needle clusters
    const clusters = 16;
    for(let c=0; c<clusters; c++){
      const cx = res/2 + (Math.random()-0.5)*280, cy = res/2 + (Math.random()-0.5)*280;
      const twigAngle = Math.random()*Math.PI*2;
      
      // Twig
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(twigAngle);
      ctx.strokeStyle = "#2b1a10"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(0, 50); ctx.stroke();

      // Needles
      for(let n=0; n<65; n++){
        const ty = (Math.random() - 0.5) * 90;
        const side = Math.random() > 0.5 ? 1 : -1;
        const nLen = Math.random()*35 + 25;
        const nAng = (side * (0.35 + Math.random()*0.35));
        ctx.strokeStyle = Math.random() > 0.4 ? "#123a16" : Math.random() > 0.5 ? "#194e1e" : "#24662a";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(0, ty);
        ctx.lineTo(Math.sin(nAng)*nLen * side, ty + Math.cos(nAng)*nLen);
        ctx.stroke();
      }
      ctx.restore();
    }
  } else if(species === 'birch'){
    // Serrated bright golden-green birch leaves
    const count = 44;
    for(let i=0; i<count; i++){
      const cx = res/2 + (Math.random()-0.5)*300, cy = res/2 + (Math.random()-0.5)*300;
      const rot = Math.random()*Math.PI*2, len = Math.random()*38 + 36, wid = len * 0.65;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(0, -len/2);
      ctx.quadraticCurveTo(wid, 0, 0, len/2);
      ctx.quadraticCurveTo(-wid, 0, 0, -len/2);
      ctx.fillStyle = Math.random() > 0.5 ? "#4da822" : Math.random() > 0.5 ? "#62be28" : "#7ed634";
      ctx.fill();
      ctx.strokeStyle = "rgba(210, 255, 140, 0.55)";
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, -len/2); ctx.lineTo(0, len/2); ctx.stroke();
      ctx.restore();
    }
  } else if(species === 'palm'){
    // Arching pinnate palm fronds
    ctx.strokeStyle = "#382816"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(res*0.1, res*0.9); ctx.quadraticCurveTo(res*0.4, res*0.4, res*0.9, res*0.1); ctx.stroke();
    for(let t=0.1; t<=0.95; t+=0.02){
      const px = (1-t)*(1-t)*(res*0.1) + 2*(1-t)*t*(res*0.4) + t*t*(res*0.9);
      const py = (1-t)*(1-t)*(res*0.9) + 2*(1-t)*t*(res*0.4) + t*t*(res*0.1);
      for(const side of [-1, 1]){
        ctx.strokeStyle = Math.random() > 0.5 ? "#28681e" : "#3b882a";
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + side*80*(1-t*0.5), py + 60);
        ctx.stroke();
      }
    }
  }

  const tex = new BABYLON.DynamicTexture(species + "_LeafTex", cv, scene, true);
  tex.hasAlpha = true;
  return tex;
}

function createProceduralGrassTexture(){
  const res = 256, cv = document.createElement('canvas'); cv.width = cv.height = res;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, res, res);

  for(let i=0; i<18; i++){
    const bx = res/2 + (Math.random()-0.5)*50;
    const by = res - 10;
    const curve = (Math.random()-0.5)*70;
    const h = Math.random()*120 + 110;
    
    ctx.beginPath();
    ctx.moveTo(bx - 4, by);
    ctx.quadraticCurveTo(bx + curve*0.5, by - h*0.5, bx + curve, by - h);
    ctx.quadraticCurveTo(bx + curve*0.5 + 3, by - h*0.5, bx + 4, by);
    ctx.fillStyle = Math.random() > 0.5 ? "#3b8820" : Math.random() > 0.5 ? "#4fa82a" : "#68c838";
    ctx.fill();
  }
  const tex = new BABYLON.DynamicTexture("GrassBladeTex", cv, scene, true);
  tex.hasAlpha = true;
  return tex;
}

      const topP = BABYLON.MeshBuilder.CreatePlane("topP_" + k, { size: 3.4 }, scene);
      topP.position.set(0.1, 5.2 + k*0.35, 0.1);
      topP.rotation.set(0.35, k * 0.75, 0.25);
      topP.material = leafMat;
      parts.push(topP);
    }
    const mergedTrunk = BABYLON.Mesh.MergeMeshes([t1, t2, ...boughs], true, true, undefined, false, true);
    mergedTrunk.material = barkMat;
    parts.unshift(mergedTrunk);

  } else if(species === 'pine'){
    // Pine: Evergreen Alpine Conifer. SSS ~0.20, dark needle clusters, tiered conical whorls
    leafMat.albedoColor = new BABYLON.Color3(0.75, 0.90, 0.75);
    leafMat.subSurface.translucencyIntensity = 0.20;

    const trunk = BABYLON.MeshBuilder.CreateCylinder("p_trunk", { height: 9.2, diameterBottom: 0.55, diameterTop: 0.08, tessellation: 8 }, scene);
    trunk.position.set(0, 4.6, 0);
    trunk.material = barkMat;
    parts.push(trunk);

    for(let tier=0; tier<7; tier++){
      const y = 2.0 + tier * 1.05;
      const tierLen = (7 - tier) * 0.5 + 0.6;
      const branchCount = 6;
      for(let b=0; b<branchCount; b++){
        const ang = (b / branchCount) * Math.PI * 2 + tier * 0.45;
        const needle = BABYLON.MeshBuilder.CreatePlane("ndl_" + tier + "_" + b, { width: tierLen * 1.1, height: 1.4 }, scene);
        needle.position.set(Math.cos(ang) * tierLen * 0.55, y, Math.sin(ang) * tierLen * 0.55);
        needle.rotation.set(0.4, -ang, 0);
        needle.material = leafMat;
        parts.push(needle);
      }
    }
    const spire = BABYLON.MeshBuilder.CreatePlane("spire", { size: 2.5 }, scene);
    spire.position.set(0, 8.8, 0); spire.material = leafMat;
    parts.push(spire);

  } else if(species === 'birch'){
    // Birch: Slender graceful white trunk with dark lenticels, vibrant light-green foliage
    leafMat.albedoColor = new BABYLON.Color3(0.9, 1.0, 0.85);
    leafMat.subSurface.translucencyIntensity = 0.60;

    const t1 = BABYLON.MeshBuilder.CreateCylinder("b_t1", { height: 3.5, diameterBottom: 0.35, diameterTop: 0.24, tessellation: 7 }, scene);
    t1.position.set(0, 1.75, 0);
    const t2 = BABYLON.MeshBuilder.CreateCylinder("b_t2", { height: 3.2, diameterBottom: 0.24, diameterTop: 0.12, tessellation: 7 }, scene);
    t2.position.set(0.18, 4.8, 0.12); t2.rotation.z = -0.08;

    const boughs = [];
    for(let i=0; i<7; i++){
      const ang = i * 1.05;
      const b = BABYLON.MeshBuilder.CreateCylinder("bb_" + i, { height: 2.5, diameterBottom: 0.16, diameterTop: 0.06, tessellation: 5 }, scene);
      b.position.set(Math.cos(ang)*0.22, 3.6 + i*0.4, Math.sin(ang)*0.22);
      b.rotation.set(Math.sin(ang)*0.75, -ang, Math.cos(ang)*0.75);
      boughs.push(b);

      const leaf = BABYLON.MeshBuilder.CreatePlane("bl_" + i, { size: 2.2 }, scene);
      leaf.position.set(b.position.x + Math.sin(b.rotation.z)*2.0, b.position.y + Math.cos(b.rotation.z)*1.7, b.position.z + Math.sin(b.rotation.x)*2.0);
      leaf.rotation.set(0.5, ang + 0.3, -0.2);
      leaf.material = leafMat;
      parts.push(leaf);
    }
    const mergedTrunk = BABYLON.Mesh.MergeMeshes([t1, t2, ...boughs], true, true, undefined, false, true);
    mergedTrunk.material = barkMat;
    parts.unshift(mergedTrunk);

  } else if(species === 'palm'){
    leafMat.albedoColor = new BABYLON.Color3(0.9, 1.0, 0.9);
    leafMat.subSurface.translucencyIntensity = 0.40;
    const trunk = BABYLON.MeshBuilder.CreateCylinder("p_tr", { height: 7.2, diameterBottom: 0.46, diameterTop: 0.24, tessellation: 8 }, scene);
    trunk.position.set(0.35, 3.6, 0); trunk.rotation.z = -0.09;
    trunk.material = barkMat;
    parts.push(trunk);

    for(let i=0; i<10; i++){
      const ang = (i / 10) * Math.PI * 2;
      const frond = BABYLON.MeshBuilder.CreatePlane("fr_" + i, { width: 3.6, height: 1.4 }, scene);
      frond.position.set(trunk.position.x + Math.cos(ang)*1.6, 7.1, trunk.position.z + Math.sin(ang)*1.6);
      frond.rotation.set(0.55, -ang, 0);
      frond.material = leafMat;
      parts.push(frond);
    }
  } else if(species === 'shrub'){
    leafMat.albedoColor = new BABYLON.Color3(0.85, 0.95, 0.85);
    leafMat.subSurface.translucencyIntensity = 0.40;
    for(let i=0; i<5; i++){
      const s = BABYLON.MeshBuilder.CreatePlane("sh_" + i, { size: 2.0 }, scene);
      s.position.set((Math.random()-0.5)*0.7, 0.9 + i*0.25, (Math.random()-0.5)*0.7);
      s.rotation.set(0.3, i * 0.78, 0.1);
      s.material = leafMat;
      parts.push(s);
    }
  }

  const masterTree = BABYLON.Mesh.MergeMeshes(parts, true, true, undefined, false, true);
  return masterTree;
}

function createMasterMesh(k){
  let mesh;
  if(['oak', 'pine', 'birch', 'palm', 'shrub'].includes(k)){
    mesh = generateProceduralTree(k);
  } else if(k === 'grass'){
    const g1 = BABYLON.MeshBuilder.CreatePlane("g1", { size: 1.4 }, scene);
    const g2 = BABYLON.MeshBuilder.CreatePlane("g2", { size: 1.4 }, scene);
    g2.rotation.y = Math.PI / 3;
    const g3 = BABYLON.MeshBuilder.CreatePlane("g3", { size: 1.4 }, scene);
    g3.rotation.y = Math.PI * 2 / 3;
    mesh = BABYLON.Mesh.MergeMeshes([g1, g2, g3], true, true, undefined, false, true);
    mesh.position.y = 0.7;
    const mat = new BABYLON.PBRMaterial("grass_MasterMat", scene);
    mat.roughness = 0.80; mat.metallic = 0.0;
    mat.albedoTexture = createProceduralGrassTexture();
    mat.opacityTexture = mat.albedoTexture;
    mat.subSurface.isTranslucencyEnabled = true;
    mat.subSurface.translucencyIntensity = 0.55;
    mat.backFaceCulling = false; mat.twoSidedLighting = true;
    mesh.material = mat;
  } else if(k === 'flower'){
    const stem = BABYLON.MeshBuilder.CreateCylinder("stem", { height: 0.6, diameter: 0.04 }, scene);
    stem.position.y = 0.3;
    const pet = BABYLON.MeshBuilder.CreateSphere("pet", { diameter: 0.32, segments: 6 }, scene);
    pet.position.y = 0.62;
    mesh = BABYLON.Mesh.MergeMeshes([stem, pet], true, true, undefined, false, true);
    const mat = new BABYLON.PBRMaterial("flower_MasterMat", scene);
    mat.albedoColor = new BABYLON.Color3(0.98, 0.45, 0.68);
    mat.roughness = 0.65;
    mesh.material = mat;
  } else if(k === 'rock'){
    mesh = BABYLON.MeshBuilder.CreateIcoSphere("rock", { radius: 1.2, subdivisions: 2 }, scene);
    const pos = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    for(let i=0; i<pos.length; i+=3){
      pos[i] += (Math.random()-0.5)*0.3; pos[i+1] *= 0.68 + (Math.random()-0.5)*0.2; pos[i+2] += (Math.random()-0.5)*0.3;
    }
    mesh.setVerticesData(BABYLON.VertexBuffer.PositionKind, pos);
    mesh.createNormals(false);
    mesh.position.y = 0.48;
    const mat = new BABYLON.PBRMaterial("rock_MasterMat", scene);
    mat.roughness = 0.94; mat.metallic = 0.02;
    mat.albedoColor = new BABYLON.Color3(0.35, 0.36, 0.38);
    mesh.material = mat;
  } else if(k === 'house'){
    const base = BABYLON.MeshBuilder.CreateBox("hBase", { width: 6, height: 3.5, depth: 6 }, scene);
    base.position.y = 1.75;
    const roof = BABYLON.MeshBuilder.CreateCylinder("hRoof", { height: 6, diameter: 4.5, tessellation: 3 }, scene);
    roof.position.y = 4.6; roof.rotation.z = Math.PI / 2;
    mesh = BABYLON.Mesh.MergeMeshes([base, roof], true, true, undefined, false, true);
    const mat = new BABYLON.PBRMaterial("house_MasterMat", scene);
    mat.albedoColor = new BABYLON.Color3(0.82, 0.76, 0.68);
    mesh.material = mat;
  } else if(k === 'block'){
    mesh = BABYLON.MeshBuilder.CreateBox("block", { width: 8, height: 12, depth: 8 }, scene);
    mesh.position.y = 6;
    const mat = new BABYLON.PBRMaterial("block_MasterMat", scene);
    mat.albedoColor = new BABYLON.Color3(0.65, 0.62, 0.58);
    mesh.material = mat;
  } else if(k === 'mid'){
    mesh = BABYLON.MeshBuilder.CreateBox("mid", { width: 9, height: 24, depth: 9 }, scene);
    mesh.position.y = 12;
    const mat = new BABYLON.PBRMaterial("mid_MasterMat", scene);
    mat.albedoColor = new BABYLON.Color3(0.55, 0.58, 0.62);
    mesh.material = mat;
  } else if(k === 'tower'){
    const b1 = BABYLON.MeshBuilder.CreateBox("t1", { width: 6, height: 48, depth: 6 }, scene);
    b1.position.y = 24;
    const spire = BABYLON.MeshBuilder.CreateCylinder("spire", { height: 8, diameterBottom: 0.6, diameterTop: 0 }, scene);
    spire.position.y = 52;
    mesh = BABYLON.Mesh.MergeMeshes([b1, spire], true, true, undefined, false, true);
    const mat = new BABYLON.PBRMaterial("tower_MasterMat", scene);
    mat.albedoColor = new BABYLON.Color3(0.45, 0.55, 0.68);
    mesh.material = mat;
  }

  if(mesh){
    if(typeof mesh.setEnabled === 'function') mesh.setEnabled(false); // Master mesh kept hidden
    if(shadow) shadow.addShadowCaster(mesh);
  }
  return mesh;
}

['grass','flower','pine','oak','birch','palm','shrub','rock','house','block','mid','tower'].forEach(k => {
  KIND[k] = {
    list: [],
    max: k==='grass'?20000:k==='flower'?3000:k==='house'?1500:800,
    size: 1,
    vr: BLD[k]?0.08:k==='rock'?0.7:0.35,
    tint: [1, 1, 1],
    master: createMasterMesh(k),
    instances: []
  };
});

function sync(k){
  const K = KIND[k];
  if(!K.master) return;

  // Rebuild Babylon instances for this kind
  K.instances.forEach(inst => inst.dispose());
  K.instances.length = 0;

  K.list.forEach((o, idx) => {
    const inst = K.master.createInstance(`${k}_inst_${idx}`);
    inst.position.set(o.x, o.y - (k === 'rock' ? 0.12 * o.s : 0), o.z);
    inst.rotation.set(0, o.r, 0);
    const bw = BLD[k] ? K.size * o.a : o.s * o.a * K.size;
    const bh = o.s * K.size;
    inst.scaling.set(bw, bh, bw);
    inst.isPickable = false;
    K.instances.push(inst);
  });
}

const bY = (x, z, b) => Math.min(
  hgt(x, z),
  hgt(x + b*0.6, z + b*0.6), hgt(x - b*0.6, z + b*0.6),
  hgt(x + b*0.6, z - b*0.6), hgt(x - b*0.6, z - b*0.6)
);

const slope = (x, z) => Math.hypot(hgt(x+1, z) - hgt(x-1, z), hgt(x, z+1) - hgt(x, z-1)) / 2;

function add(k, x, z, f=1, yaw=0){
  const K = KIND[k], bd = BLD[k];
  if(!bd && k != 'rock' && k != 'palm' && f < 1.5 && R() > veg) return 0;
  if(K.list.length >= K.max || Math.abs(x) > S/2 - 1 - (bd||0) || Math.abs(z) > S/2 - 1 - (bd||0)) return 0;

  const y = bd ? bY(x, z, bd) : hgt(x, z);
  const [ms, sp] = RULE[k];
  const sl = slope(x, z);

  if(y < wl + (bd ? 0.7 : k == 'rock' ? -0.3 : 0.25) || sl > ms) return 0;
  if(k == 'grass' && vn(x*0.09 + 9, z*0.09 + 4)*f < 0.32) return 0;
  if((k == 'pine' || k == 'oak' || k == 'birch') && vn(x*0.05 + 3, z*0.05 + 8)*f < 0.38) return 0;
  if(k == 'rock' && f < 1.5 && R() > 0.25 + sl*0.8) return 0;

  const s = SM[k] * (1 + (R() - 0.5)*2*K.vr);
  if(bd){
    for(const q in BLD){
      if(KIND[q].list.some(o => (o.x - x)**2 + (o.z - z)**2 < (bd + BLD[q])**2 * 0.8)) return 0;
    }
  } else if(sp && K.list.some(o => (o.x - x)**2 + (o.z - z)**2 < (sp*(o.s + s)*0.5)**2)){
    return 0;
  }

  K.list.push({
    x, y, z, s,
    r: bd ? yaw + Math.floor(R()*4)*1.5708 : R()*6.28,
    a: bd ? 0.94 + R()*0.12 : 0.88 + R()*0.24,
    v: 0.82 + R()*0.3
  });
  return 1;
}

function plantAt(p){
  if(br.kind == 'erase'){
    for(const k in KIND){
      if(tab == 'city' && !BLD[k] || tab == 'plants' && BLD[k]) continue;
      const K = KIND[k], n = K.list.length;
      K.list = K.list.filter(o => Math.hypot(o.x - p.x, o.z - p.z) > br.r);
      if(K.list.length != n) sync(k);
    }
    return;
  }

  const k = br.kind;
  const n = Math.max(1, Math.round(br.den * RATE[k])) * 2;
  for(let i=0; i<n; i++){
    const a = R()*6.283, d = Math.sqrt(R())*br.r;
    add(k, p.x + Math.cos(a)*d, p.z + Math.sin(a)*d, 1.7, cityAng);
  }
  if(BLD[k]){
    for(const q in KIND){
      if(!BLD[q]){
        const Q = KIND[q], n0 = Q.list.length;
        Q.list = Q.list.filter(o => Math.hypot(o.x - p.x, o.z - p.z) > br.r);
        if(Q.list.length != n0) sync(q);
      }
    }
  }
  sync(k);
}

function clearUnderB(){
  const B = [];
  for(const q in BLD){
    KIND[q].list.forEach(o => B.push([o.x, o.z, BLD[q]*KIND[q].size*0.95 + 1]));
  }
  if(!B.length) return;
  for(const k in KIND){
    if(BLD[k]) continue;
    const K = KIND[k], n = K.list.length;
    K.list = K.list.filter(o => !B.some(b => (o.x - b[0])**2 + (o.z - b[1])**2 < b[2]*b[2]));
    if(K.list.length != n) sync(k);
  }
}

function scatter(kb){
  for(const k in KIND){
    if(!(kb && BLD[k])) KIND[k].list = [];
  }
  for(let i=0; i<18000; i++){
    const x = (R() - 0.5)*S*0.96, z = (R() - 0.5)*S*0.96;
    let r = R(), k = 'rock';
    for(const [n, w] of TAB){
      if(r < w){ k = n; break; }
      r -= w;
    }
    add(k, x, z);
  }
  if(kb) clearUnderB();
  for(const k in KIND) sync(k);
}

function resnap(){
  for(const k in KIND){
    KIND[k].list.forEach(o => o.y = BLD[k] ? bY(o.x, o.z, BLD[k]) : hgt(o.x, o.z));
    sync(k);
  }
}

function setSeason(s){
  season = s;
  for(const k in KIND){
    KIND[k].tint = SEAS[s][k] || [1, 1, 1];
    sync(k);
  }
}

// City Building Helpers
let cityTap = false, cityR = 30, cityD = 0.8, cityLvl = true, cityRoad = true, cityAng = 0;
const cityCell = 12;

function level(cx, cz, r, t){
  if(t === undefined){
    let s = hgt(cx, cz);
    for(let a=0; a<12; a++) s += hgt(cx + Math.cos(a*0.5236)*r*0.5, cz + Math.sin(a*0.5236)*r*0.5);
    t = Math.max(s/13, wl + 0.9);
  }
  for(let j=0; j<W; j++){
    for(let i=0; i<W; i++){
      const k = j*W + i, d = Math.hypot(i*D - S/2 - cx, j*D - S/2 - cz) / (r*1.15);
      if(d >= 1 || H[k] < wl + 0.3) continue;
      H[k] += (t - H[k])*(1 - sm(0.6, 1, d))*0.9;
    }
  }
  upd();
}

function genCity(c){
  push();
  const r = cityR, cs = cityCell, ang = cityAng = (R() - 0.5)*0.5;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  if(cityLvl) level(c.x, c.z, r);

  const n = Math.ceil(r/cs), L = [];
  for(let i=-n; i<=n; i++) for(let j=-n; j<=n; j++){
    const u = i*cs, w = j*cs, d = Math.hypot(u, w)/r;
    if(d <= 1) L.push({ x: c.x + u*ca - w*sa, z: c.z + u*sa + w*ca, d });
  }

  let made = 0;
  L.forEach(l => {
    if(R() > cityD*(1.15 - l.d*0.55)) return;
    const p = R();
    const t = l.d < 0.28 ? (p < 0.6 ? 'tower' : 'mid') :
              l.d < 0.60 ? (p < 0.15 ? 'tower' : p < 0.6 ? 'mid' : 'block') :
              l.d < 0.80 ? (p < 0.5 ? 'block' : 'house') : 'house';
    if(add(t, l.x + (R() - 0.5)*0.6, l.z + (R() - 0.5)*0.6, 1.7, ang)) made++;
  });

  if(cityRoad && made){
    for(let j=0; j<W; j++) for(let i=0; i<W; i++){
      const x = i*D - S/2 - c.x, z = j*D - S/2 - c.z;
      const u = x*ca + z*sa, w = -x*sa + z*ca;
      if(Math.hypot(u, w) > r*0.97) continue;
      const fu = u/cs - Math.floor(u/cs), fw = w/cs - Math.floor(w/cs);
      if((Math.abs(fu - 0.5)*cs < 1.5 || Math.abs(fw - 0.5)*cs < 1.5) && H[j*W + i] > wl + 0.4){
        MI[j*W + i] = 5;
      }
    }
  }
  upd();
  clearUnderB();
  resnap();
  msg(made ? made + ' buildings generated' : 'No valid flat land here. Try a flatter location.');
}

    const lt = new BABYLON.PointLight("lampLt", new BABYLON.Vector3(0, 3.3, 0), scene);
    lt.diffuse = new BABYLON.Color3(1.0, 0.85, 0.6);
    lt.intensity = 1.5; lt.parent = root;
    return root;
  }
};

const nm = b => {
  const n = objs.filter(o => o.name.split('.')[0] == b).length;
  return n ? b + '.' + String(n).padStart(3, '0') : b;
};

// Babylon Gizmo Manager for Object Manipulation
const gizmoManager = new BABYLON.GizmoManager(scene);
gizmoManager.positionGizmoEnabled = true;
gizmoManager.rotationGizmoEnabled = false;
gizmoManager.scaleGizmoEnabled = false;

function select(o){
  sel = o;
  if(o){
    const meshTarget = o.getChildMeshes ? o.getChildMeshes()[0] : o;
    gizmoManager.attachToMesh(meshTarget || o);
    sbx.setEnabled(true);
    if(meshTarget) {
      const bInfo = meshTarget.getBoundingInfo();
      sbx.position.copyFrom(o.position);
      sbx.scaling.set(bInfo.maximum.x - bInfo.minimum.x + 0.4, bInfo.maximum.y - bInfo.minimum.y + 0.4, bInfo.maximum.z - bInfo.minimum.z + 0.4);
    }
  } else {
    gizmoManager.attachToMesh(null);
    sbx.setEnabled(false);
  }
  if(tab == 'obj') build();
}

function dup(){
  if(!sel) return;
  push();
  const baseName = sel.name.split('.')[0];
  const c = LIB[baseName] ? LIB[baseName]() : sel.clone(nm(baseName));
  c.name = nm(baseName);
  c.position.copyFrom(sel.position);
  c.position.x += 2;
  objs.push(c);
  select(c);
}

function del(){
  if(!sel) return;
  push();
  const o = sel;
  select(null);
  o.dispose();
  objs.splice(objs.indexOf(o), 1);
  if(tab == 'obj') build();
}

let mapRoot = null, mapName = '', mapBase = 1, mapK = 1, mapY = 0, mapR = 0, dem = 22;

function fitMap(){
  if(!mapRoot) return;
  mapRoot.scaling.setAll(mapBase * mapK);
  mapRoot.rotation.y = mapR * Math.PI / 180;
  mapRoot.position.set(0, Math.max(hgt(0, 0), wl + 0.1) + mapY, 0);
}

async function parseModel(data, ext, name){
  try {
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "", data, scene);
    if(mapRoot) mapRoot.dispose();
    mapRoot = new BABYLON.TransformNode("ImportedMapRoot", scene);
    res.meshes.forEach(m => {
      m.parent = mapRoot;
      m.receiveShadows = true;
      if(shadow) shadow.addShadowCaster(m);
    });
    mapName = name; mapBase = 1.0; mapK = 1.0; mapY = 0; mapR = 0;
    fitMap();
    build();
    msg('Imported ' + name);
  } catch(er){
    msg('Import failed: ' + er.message);
  }
}

function importModel(f){
  const ext = f.name.split('.').pop().toLowerCase();
  const url = URL.createObjectURL(f);
  parseModel(url, ext, f.name);
}

function importHeightmap(f){
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = W;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, W, W);
      const d = x.getImageData(0, 0, W, W).data;
      push();
      for(let k=0; k<W*W; k++) H[k] = (d[k*4]*0.3 + d[k*4+1]*0.59 + d[k*4+2]*0.11)/255*dem - dem*0.3;
      MI.fill(255);
      upd();
      scatter(1);
      msg('Heightmap imported');
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}

function flattenUnder(){
  if(!mapRoot) return;
  push();
  level(mapRoot.position.x, mapRoot.position.z, 25, mapRoot.position.y);
  resnap();
}

function rmMap(){
  if(mapRoot) mapRoot.dispose();
  mapRoot = null;
  build();
}

function updSky(){
  const A = az * Math.PI / 180, a = (tod - 6)/12 * Math.PI;
  const e = Math.sin(a);
  const sunDir = new BABYLON.Vector3(-Math.cos(a)*Math.cos(A), -Math.max(0.08, e), -Math.cos(a)*Math.sin(A)).normalize();
  sun.direction = sunDir;
  sun.position = new BABYLON.Vector3(-sunDir.x*160, -sunDir.y*160, -sunDir.z*160);

  const day = cl(e*3 + 0.2, 0, 1);
  const solid = (mode != 'render');

  sun.intensity = solid ? 0.5 : 2.2 * cl(e*3, 0, 1);
  hemi.intensity = solid ? 1.1 : 0.1 + 0.55 * day;
  sun.shadowEnabled = !solid;

  scene.fogDensity = (mode == 'render' && !ortho) ? fogD : 0;
  if(mode == 'render'){
    const skyC = new BABYLON.Color3(0.1 + 0.45*day, 0.15 + 0.55*day, 0.3 + 0.6*day);
    scene.clearColor = new BABYLON.Color4(skyC.r, skyC.g, skyC.b, 1.0);
    skyMat.emissiveColor = skyC;
  } else {
    scene.clearColor = new BABYLON.Color4(0.24, 0.24, 0.24, 1.0);
  }

  clouds.forEach((g, i) => {
    g.setEnabled(i < cov * clouds.length);
  });
}

// Undo / Redo Stack
const US = [], RS = [];
const enc = l => { const a = new Float32Array(l.length*7); l.forEach((o, i) => a.set([o.x, o.y, o.z, o.s, o.r, o.a, o.v], i*7)); return a; };
const dec = a => { const l = []; for(let i=0; i<a.length; i+=7) l.push({ x: a[i], y: a[i+1], z: a[i+2], s: a[i+3], r: a[i+4], a: a[i+5], v: a[i+6] }); return l; };

const snap = () => ({
  H: H.slice(),
  M: MI.slice(),
  K: Object.fromEntries(Object.keys(KIND).map(k => [k, enc(KIND[k].list)])),
  O: objs.map(o => ({
    t: o.name.split('.')[0],
    n: o.name,
    p: [o.position.x, o.position.y, o.position.z],
    r: [o.rotation.x, o.rotation.y, o.rotation.z],
    s: [o.scaling.x, o.scaling.y, o.scaling.z]
  }))
});

function restore(s){
  H.set(s.H); MI.set(s.M);
  upd();
  for(const k in KIND){
    KIND[k].list = dec(s.K[k]);
    sync(k);
  }
  select(null);
  objs.splice(0).forEach(o => o.dispose());
  s.O.forEach(d => {
    if(LIB[d.t]){
      const o = LIB[d.t]();
      o.name = d.n;
      o.position.set(...d.p);
      o.rotation.set(...d.r);
      o.scaling.set(...d.s);
      objs.push(o);
    }
  });
  shade();
  if(tab == 'obj') build();
}

function push(){
  US.push(snap());
  if(US.length > 20) US.shift();
  RS.length = 0;
}
function undo(){ if(!US.length) return; RS.push(snap()); restore(US.pop()); }
function redo(){ if(!RS.length) return; US.push(snap()); restore(RS.pop()); }
$('#un').onclick = undo; $('#re').onclick = redo;

function msg(t){
  $('#info').textContent = t;
  setTimeout(() => { $('#info').textContent = ''; }, 4500);
}

let painting = false, lastT = 0, down = null;

function pickGround(){
  const pick = scene.pick(scene.pointerX, scene.pointerY, m => m === ter);
  return (pick && pick.hit && pick.pickedPoint) ? pick.pickedPoint : null;
}

function pickObject(){
  const pick = scene.pick(scene.pointerX, scene.pointerY, m => {
    return objs.some(o => o === m || (o.getChildMeshes && o.getChildMeshes().includes(m)));
  });
  if(pick && pick.hit && pick.pickedMesh){
    let node = pick.pickedMesh;
    while(node && node.parent && objs.includes(node.parent)) node = node.parent;
    return node;
  }
  return null;
}

  if(tab == 'city' && cityTap){

    return;

  if(place && LIB[place]){
    const p = pickGround();
    if(p){
      const o = LIB[place]();
      o.name = nm(place);
      o.position.copyFrom(p);
      o.rotation.y = R()*6.28;
      push();
      objs.push(o);
      shade();
      select(o);
    }
    return;
  }
  const o = pickObject();
  select(o);
}

scene.onPointerObservable.add(pi => {
  if(pi.type === BABYLON.PointerEventTypes.POINTERDOWN){
    down = { x: scene.pointerX, y: scene.pointerY };
    if(pi.event.button === 2) return;
    if(brushTab() && !nav){
      const p = pickGround();
      if(p){
        painting = true;
        push();
        fl = p.y;
        lastT = performance.now();
        applyBrush(p, 0.03);
      }
    }
  } else if(pi.type === BABYLON.PointerEventTypes.POINTERMOVE){
    if(!brushTab() || nav){
      ring.setEnabled(false);
      return;
    }
    const p = pickGround();
    if(p){
      ring.setEnabled(true);
      ring.position.set(p.x, p.y + 0.3, p.z);
      ring.scaling.set(br.r, 1, br.r);
    } else {
      ring.setEnabled(false);
    }

    if(painting && p){
      const t = performance.now();
      if(t - lastT > 30){
        applyBrush(p, Math.min(0.06, (t - lastT)/1000));
        lastT = t;
      }
    }
  } else if(pi.type === BABYLON.PointerEventTypes.POINTERUP){
    if(painting){
      painting = false;
      if(tab == 'terrain') resnap();
    }
    if(down && Math.hypot(scene.pointerX - down.x, scene.pointerY - down.y) < 6){
      tap(pi.event);
    }
    down = null;
  }
});

$('#mode').onclick = () => { nav = !nav; setNav(); };
$('#px').onclick = () => showPanel(false);
$('#bg').onclick = () => { showPanel(!panelOpen); if(panelOpen) build(); };
$('#bw').onclick = () => {
  showPanel(false);
  cam.alpha = -Math.PI*0.35; cam.beta = Math.PI*0.35; cam.radius = 110;
  cam.target.set(0, 4, 0);
};
$('#bi').onclick = () => setTab('import');

function showPanel(v){
  panelOpen = v;
  $('#panel').hidden = !v;
  $('#bg').classList.toggle('on', v);
  if(!v){ select(null); ring.setEnabled(false); }
  setNav();
}

// 8. DATA EXPORT TO MAIN GRID & HOST APP
const b64 = a => {
  const u = new Uint8Array(a.buffer);
  let s = '';
  for(let i=0; i<u.length; i+=8192) s += String.fromCharCode.apply(null, u.subarray(i, i+8192));
  return btoa(s);
};

function importToGrid(){
  const f = {};
  for(const k in KIND){
    const K = KIND[k];
    f[k] = { count: K.list.length, size: K.size, tint: K.tint, data: b64(enc(K.list)) };
  }
  const d = {
    app: 'final-effect',
    engine: 'babylonjs',
    version: 2,
    units: 'm',
    terrain: {
      size: S, segments: N, vertexCount: W*W,
      heights: b64(H), materials: b64(MI),
      biome, heightScale: hs, rockSlope: rockT, snowLine: snowL
    },
    water: { level: wl, visible: water.isEnabled(), palette: wp },
    sky: { timeOfDay: tod, sunAngle: az, fog: fogD },
    foliage: f,
    objects: objs.map(o => ({
      name: o.name,
      position: [o.position.x, o.position.y, o.position.z],
      rotation: [o.rotation.x, o.rotation.y, o.rotation.z],
      scale: [o.scaling.x, o.scaling.y, o.scaling.z]
    }))
  };

  const js = JSON.stringify(d, null, 2);
  const host = window.parent !== window ? window.parent : window.opener;
  let sent = false;
  try {
    if(host){
      host.postMessage({ type: 'final-effect:import', payload: d }, '*');
      sent = true;
    }
  } catch(e){}

  $('#exp').value = js;
  $('#ovt').textContent = (sent ? 'Posted to host app (postMessage "final-effect:import"). ' : 'Scene export JSON: ') + Math.round(js.length/1024) + ' KB';
  $('#ov').hidden = false;
}
$('#imp').onclick = importToGrid;
$('#cp').onclick = () => {
  const t = $('#exp'); t.select();
  navigator.clipboard.writeText(t.value);
  msg('Copied JSON to clipboard');
};
$('#cl').onclick = () => $('#ov').hidden = true;

// Keyboard Shortcuts
addEventListener('keydown', e => {
  const a = document.activeElement;
  if(/INPUT|TEXTAREA/.test(a.tagName) && a.type != 'range') return;
  const k = e.key.toLowerCase();

  if((e.ctrlKey || e.metaKey) && (k == 'z' || k == 'y')){
    (k == 'y' || e.shiftKey ? redo : undo)();
    e.preventDefault(); return;
  }
  if(k == 'x' || k == 'delete'){ if(sel) del(); }
  else if(k == 'd' && e.shiftKey){ if(sel) dup(); }
  else if(k == 'z'){
    mode = (mode == 'solid' ? 'render' : mode == 'render' ? 'wire' : 'solid');
    [...$('#sh').children].forEach(c => c.classList.toggle('on', c.textContent.toLowerCase() == mode));
    shade();
  }
});

// Render Loop & Animation
let lastFpsTime = performance.now(), frameCount = 0;
let loopTime = 0;

engine.runRenderLoop(() => {
  loopTime += 0.02 * wspd;
  scene.render();
  navg();
  syncOrtho();

  clouds.forEach(g => {
    g.position.x += 0.12 * wspd;
    if(g.position.x > 260) g.position.x = -260;
  });

  frameCount++;
  const now = performance.now();
  if(now - lastFpsTime >= 500){
    $('#fps').textContent = Math.round((frameCount*1000)/(now - lastFpsTime)) + ' fps';
    frameCount = 0;
    lastFpsTime = now;
  }
});

addEventListener('resize', () => {
  engine.resize();
  syncOrtho();
});

// 9. INITIALIZATION
[() => gen(), () => scatter(1), () => updSky(), () => setTab('terrain'), () => showPanel(false)].forEach(f => {
  try { f(); } catch(e){ showErr('Init: ' + e.message); }
});
