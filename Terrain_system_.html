<style>

<script>
/* =========================================================================
   Final Effect 3D Terrain Studio — Restored High-Poly Terrain & PBR Blending
   ========================================================================= */
const $=s=>document.querySelector(s), R=Math.random, cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const S=120, N=180, D=S/N, W=N+1, cv=$('#c');
let tab='terrain', mode='render', nav=false, place=null, sel=null, seed=42, wl=0, tod=14, az=45, cov=.5, fogD=.0020, wspd=1.2, wp=0, fl=0;
const br={tool:'raise', r:7, str:.5, tex:0, kind:'pine', den:12, falloff:'smooth'}, objs=[];

// 1. BABYLON.JS SCENE, CAMERAS & VIBRANT ENVIRONMENT LIGHTING SETUP
const engine=new BABYLON.Engine(cv, true, {preserveDrawingBuffer:true, stencil:true, antialias:true, powerPreference:'high-performance'}, true);
engine.setHardwareScalingLevel(Math.min(1.5, 1 / (window.devicePixelRatio || 1)));
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(0.48, 0.68, 0.88, 1);
scene.ambientColor=new BABYLON.Color3(0.92, 0.95, 1.0);

// Atmospheric Fog & ACES Tone Mapping
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity=fogD;
scene.fogColor=new BABYLON.Color3(0.82, 0.89, 0.97);
scene.imageProcessingConfiguration.toneMappingEnabled = true;
scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
scene.imageProcessingConfiguration.exposure = 1.48;
scene.imageProcessingConfiguration.contrast = 1.14;

// Cameras (Orbit & Free Fly)
const orbitCam=new BABYLON.ArcRotateCamera('OrbitCam', -Math.PI*0.25, Math.PI*0.32, 110, new BABYLON.Vector3(0,5,0), scene);
orbitCam.lowerRadiusLimit=5; orbitCam.upperRadiusLimit=360; orbitCam.wheelPrecision=25;
orbitCam.attachControl(cv, true); orbitCam.panningSensibility=75;

const freeCam=new BABYLON.UniversalCamera('FreeCam', new BABYLON.Vector3(0, 25, -90), scene);
freeCam.setTarget(new BABYLON.Vector3(0, 4, 0));
freeCam.speed=1.8;

let isFlyMode=false;
scene.activeCamera=orbitCam;

// 2. BRIGHT SUN & CLEAN SHADOWS
const hemi=new BABYLON.HemisphericLight('SkyLight', new BABYLON.Vector3(0,1,0), scene);
hemi.intensity=1.75;
hemi.diffuse=new BABYLON.Color3(1.0, 1.0, 1.0);
hemi.groundColor=new BABYLON.Color3(0.60, 0.55, 0.50);

const sun=new BABYLON.DirectionalLight('SunLight', new BABYLON.Vector3(-0.52, -0.85, 0.40), scene);
sun.position=new BABYLON.Vector3(90, 160, 65);
sun.intensity=3.8;
sun.diffuse=new BABYLON.Color3(1.0, 0.97, 0.90);
sun.shadowEnabled=true;
sun.shadowMinZ=1;
sun.shadowMaxZ=380;

let shadow;
try {
  shadow = new BABYLON.CascadedShadowGenerator(2048, sun);
  shadow.cascadeBlendPercentage = 0.35;
  shadow.stabilizeCascades = true;
  shadow.usePercentageCloserFiltering = true;
  shadow.filteringQuality = BABYLON.ShadowGenerator.QUALITY_HIGH;
  shadow.lambda = 0.85;
  shadow.bias = 0.0005;
  shadow.normalBias = 0.005;
} catch(e) {
  shadow = new BABYLON.ShadowGenerator(2048, sun);
  shadow.usePercentageCloserFiltering = true;
  shadow.filteringQuality = BABYLON.ShadowGenerator.QUALITY_HIGH;
  shadow.bias = 0.0005;
  shadow.normalBias = 0.005;
}

// HDRI Environment Skybox
let skybox = null;
try {
  const hdrTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/environmentSpecular.env", scene);
  scene.environmentTexture = hdrTexture;
  scene.environmentIntensity = 1.4;
  
  skybox = BABYLON.MeshBuilder.CreateBox("hdrSkyBox", {size: 980.0}, scene);
  const skyboxMaterial = new BABYLON.BackgroundMaterial("skyBoxMat", scene);
  skyboxMaterial.reflectionTexture = hdrTexture.clone();
  skyboxMaterial.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
  skyboxMaterial.backFaceCulling = false;
  skybox.material = skyboxMaterial;
  skybox.isPickable = false;
} catch(e) {
  console.log('HDRI Environment fallback:', e);
}

// 3. CONTINUOUS MATHEMATICAL SIMPLEX / PERLIN NOISE ALGORITHM
const p_perm=new Uint8Array(512);
const p_p=[151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
for(let i=0;i<256;i++) p_perm[i]=p_perm[i+256]=p_p[i];

function fade(t){ return t*t*t*(t*(t*6-15)+10); }
function lerp(t,a,b){ return a+t*(b-a); }
function grad(hash,x,y,z){
  const h=hash&15, u=h<8?x:y, v=h<4?y:h==12||h==14?x:z;
  return ((h&1)===0?u:-u)+((h&2)===0?v:-v);
}
function noise3D(x,y,z){
  const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255;
  x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
  const u=fade(x), v=fade(y), w=fade(z);
  const A=p_perm[X]+Y, AA=p_perm[A]+Z, AB=p_perm[A+1]+Z, B=p_perm[X+1]+Y, BA=p_perm[B]+Z, BB=p_perm[B+1]+Z;
  return lerp(w, lerp(v, lerp(u, grad(p_perm[AA], x, y, z), grad(p_perm[BA], x-1, y, z)),
                         lerp(u, grad(p_perm[AB], x, y-1, z), grad(p_perm[BB], x-1, y-1, z))),
                 lerp(v, lerp(u, grad(p_perm[AA+1], x, y, z-1), grad(p_perm[BA+1], x-1, y, z-1)),
                         lerp(u, grad(p_perm[AB+1], x, y-1, z-1), grad(p_perm[BB+1], x-1, y-1, z-1))));
}
function fbm3D(x,y,z,oct=5){
  let val=0, amp=0.5, freq=1.0;
  for(let i=0;i<oct;i++){
    val+=noise3D(x*freq, y*freq, z*freq)*amp;
    amp*=0.5; freq*=2.05;
  }
  return val;
}

// 4. REALISTIC OCEAN WATER WITH DYNAMIC WAVES
const water=BABYLON.MeshBuilder.CreateGround('WaterPlane', {width:360, height:360, subdivisions:64}, scene);
water.position.y=wl;
water.isPickable=false;

let waterMat;
try {
  waterMat=new BABYLON.WaterMaterial('WaterMat', scene, new BABYLON.Vector2(512, 512));
  waterMat.bumpTexture=new BABYLON.Texture('https://assets.babylonjs.com/textures/waterbump.png', scene);
  waterMat.windForce=45;
  waterMat.waveHeight=0.38;
  waterMat.waveLength=0.16;
  waterMat.bumpHeight=0.65;
  waterMat.waterColor=new BABYLON.Color3(0.04, 0.35, 0.58);
  waterMat.waterColor2=new BABYLON.Color3(0.14, 0.68, 0.85);
  waterMat.colorBlendFactor=0.25;
  waterMat.specularPower=64;
  if(skybox) waterMat.addToRenderList(skybox);
  water.material=waterMat;
} catch(e) {
  const pbrW=new BABYLON.PBRMaterial('FallbackWater', scene);
  pbrW.albedoColor=new BABYLON.Color3(0.06, 0.34, 0.62);
  pbrW.roughness=0.08; pbrW.metallic=0.05; pbrW.alpha=0.85;
  water.material=pbrW;
}

// 5. DIRECT SEAMLESS EXTERNAL PBR TEXTURES & MULTI-BIOME PALETTES
const BIO={
  hills:{
    name:'Temperate Hills',
    albedo:'https://assets.babylonjs.com/textures/grass.png',
    bump:'https://assets.babylonjs.com/textures/grassn.png',
    // [Meadow Grass, Loamy Soil, Slate Cliff Rock, Shore Sand, Alpine Snow]
    p:[[.36,.84,.20],[.52,.38,.24],[.42,.44,.48],[.94,.84,.58],[.98,.99,1.0]],
    s:18, sun:0xfff6ea, fog:0xd8e8f8, water:0x007799
  },
  alpine:{
    name:'Alpine Glaciers',
    albedo:'https://assets.babylonjs.com/textures/rock.png',
    bump:'https://assets.babylonjs.com/textures/rockn.png',
    p:[[.38,.68,.28],[.48,.38,.28],[.52,.54,.58],[.85,.80,.70],[.99,1.0,1.0]],
    s:10, sun:0xffffff, fog:0xe2f0fc, water:0x1b5b80
  },
  desert:{
    name:'Desert Oasis',
    albedo:'https://assets.babylonjs.com/textures/sand.jpg',
    bump:'https://assets.babylonjs.com/textures/rockn.png',
    p:[[.96,.80,.48],[.85,.62,.38],[.76,.50,.34],[.98,.88,.62],[.94,.88,.80]],
    s:22, sun:0xffeedd, fog:0xf6ddb8, water:0x0099aa
  },
  volc:{
    name:'Volcanic Caldera',
    albedo:'https://assets.babylonjs.com/textures/rock.png',
    bump:'https://assets.babylonjs.com/textures/rockn.png',
    p:[[.24,.24,.28],[.38,.28,.20],[.30,.30,.34],[.46,.36,.28],[.52,.52,.58]],
    s:20, sun:0xffaa77, fog:0x524238, water:0x18283a
  }
};

const H=new Float32Array(W*W), MI=new Uint8Array(W*W).fill(255);
let biome='hills', hs=34, rockT=0.75, snowL=18;
let PAL=BIO.hills.p;

function hgt(x,z){
  const u=cl((x+S/2)/D,0,N-.001), v=cl((z+S/2)/D,0,N-.001);
  const i=u|0, j=v|0, a=u-i, b=v-j, k=j*W+i;
  return H[k]*(1-a)*(1-b)+H[k+1]*a*(1-b)+H[k+W]*(1-a)*b+H[k+W+1]*a*b;
}

function slope(x,z){
  const d = D;
  const dhdx = (hgt(x + d, z) - hgt(x - d, z)) / (2 * d);
  const dhdz = (hgt(x, z + d) - hgt(x, z - d)) / (2 * d);
  return Math.hypot(dhdx, dhdz);
}

// SMOOTH SLOPE & ELEVATION COLOR BLENDING
function getTerrainColor(x, z, h){
  const sl = slope(x, z);
  const grass = PAL[0], dirt = PAL[1], rock = PAL[2], sand = PAL[3], snow = PAL[4];
  
  const shoreFactor = cl((wl + 1.4 - h) / 1.6, 0, 1);
  const slopeRock = cl((sl - rockT) / 0.55, 0, 1);
  const altitudeRock = cl((h - 6.5) / 12.0, 0, 1);
  const rockFactor = Math.max(slopeRock, altitudeRock * 0.88);
  const snowFactor = cl((h - snowL) / 3.2, 0, 1) * (1.0 - slopeRock * 0.5);
  const dirtFactor = cl((h - 3.5) / 6.0, 0, 1);
  
  let r = lerp(grass[0], dirt[0], dirtFactor);
  let g = lerp(grass[1], dirt[1], dirtFactor);
  let b = lerp(grass[2], dirt[2], dirtFactor);
  
  r = lerp(r, rock[0], rockFactor);
  g = lerp(g, rock[1], rockFactor);
  b = lerp(b, rock[2], rockFactor);
  
  r = lerp(r, snow[0], snowFactor);
  g = lerp(g, snow[1], snowFactor);
  b = lerp(b, snow[2], snowFactor);
  
  r = lerp(r, sand[0], shoreFactor);
  g = lerp(g, sand[1], shoreFactor);
  b = lerp(b, sand[2], shoreFactor);
  
  return [r, g, b];
}

// 6. ROCK-SOLID HIGH-POLY MESH CREATION & PBR TEXTURING
const tmat=new BABYLON.PBRMaterial('TerrainPBRMaterial', scene);
tmat.roughness=0.76;
tmat.metallic=0.02;
tmat.directIntensity=1.45;
tmat.environmentIntensity=1.35;
tmat.specularIntensity=0.45;
tmat.useVertexColors=true;
tmat.backFaceCulling=false;

function updateBiomeTextures(bKey){
  const bio = BIO[bKey] || BIO.hills;
  
  if (tmat.albedoTexture) tmat.albedoTexture.dispose();
  const albTex = new BABYLON.Texture(bio.albedo, scene);
  albTex.uScale = albTex.vScale = 30;
  albTex.anisotropicFilteringLevel = 16;
  tmat.albedoTexture = albTex;

  if (tmat.bumpTexture) tmat.bumpTexture.dispose();
  const bmpTex = new BABYLON.Texture(bio.bump, scene);
  bmpTex.uScale = bmpTex.vScale = 30;
  bmpTex.anisotropicFilteringLevel = 16;
  tmat.bumpTexture = bmpTex;
  tmat.bumpTexture.level = 0.85;
}

let terrain=null;
function makeTerrain(){
  if(terrain) terrain.dispose();
  const positions=[], indices=[], colors=[], uvs=[];
  for(let j=0; j<=N; j++){
    for(let i=0; i<=N; i++){
      const k=j*W+i, x=i*D-S/2, z=j*D-S/2, h=H[k];
      positions.push(x, h, z);
      uvs.push(i / N, j / N);
      const c = MI[k] !== 255 ? PAL[MI[k]] : getTerrainColor(x, z, h);
      colors.push(c[0], c[1], c[2], 1.0);
    }
  }
  for(let j=0; j<N; j++){
    for(let i=0; i<N; i++){
      const a=j*W+i, b=a+1, c=a+W, d=c+1;
      indices.push(a,c,b, b,c,d);
    }
  }
  const vd=new BABYLON.VertexData();
  vd.positions=positions; vd.indices=indices; vd.colors=colors; vd.uvs=uvs;

  // Continuous Smooth Analytical Surface Normals (Zero Shadow Stepping)
  const normals = new Float32Array((N + 1) * (N + 1) * 3);
  for (let j = 0; j <= N; j++) {
    for (let i = 0; i <= N; i++) {
      const k = j * W + i;
      const iL = Math.max(0, i - 1), iR = Math.min(N, i + 1);
      const jD = Math.max(0, j - 1), jU = Math.min(N, j + 1);
      const dx = (iR - iL) * D;
      const dz = (jU - jD) * D;
      const dhdx = (H[j * W + iR] - H[j * W + iL]) / dx;
      const dhdz = (H[jU * W + i] - H[jD * W + i]) / dz;
      
      let nx = -dhdx, ny = 1.0, nz = -dhdz;
      const len = Math.hypot(nx, ny, nz) || 1;
      normals[k * 3]     = nx / len;
      normals[k * 3 + 1] = ny / len;
      normals[k * 3 + 2] = nz / len;
    }
  }
  vd.normals = normals;

  terrain=new BABYLON.Mesh('ProceduralTerrain', scene);
  vd.applyToMesh(terrain, true);
  terrain.material=tmat;
  terrain.receiveShadows=true;
  terrain.isPickable=true;
  if(shadow) shadow.addShadowCaster(terrain);
  if(waterMat && waterMat.addToRenderList) waterMat.addToRenderList(terrain);
  return terrain;
}

function updateTerrain(){
  makeTerrain();
}

// 7. RESTORED PROCEDURAL NOISE TERRAIN GENERATION (INSTANT & ROBUST)
function gen(){
  seed=(R()*100000)|0;
  MI.fill(255);
  for(let j=0; j<=N; j++){
    for(let i=0; i<=N; i++){
      const x=i*D-S/2, z=j*D-S/2;
      const n1 = fbm3D(x*0.015 + seed*0.1, 0, z*0.015 + seed*0.1, 5);
      const n2 = Math.abs(noise3D(x*0.032, 10, z*0.032));
      const ridge = (1.0 - n2) * 11.0;
      
      const dist = Math.hypot(x, z) / (S * 0.46);
      const islandFalloff = Math.max(0, 1.0 - Math.pow(dist, 2.2));
      H[j*W+i] = (n1 * hs + ridge - 3.5) * islandFalloff + (1.0 - islandFalloff)*(-10.0);
    }
  }
  updateTerrain();
}

function setBiome(b, init){
  biome=b;
  const bio=BIO[b] || BIO.hills;
  PAL=bio.p; snowL=bio.s;
  if(bio.sun) sun.diffuse=BABYLON.Color3.FromHexString('#'+bio.sun.toString(16).padStart(6,'0'));
  if(bio.fog) scene.fogColor=BABYLON.Color3.FromHexString('#'+bio.fog.toString(16).padStart(6,'0'));
  if(waterMat && waterMat.waterColor && bio.water){
    waterMat.waterColor=BABYLON.Color3.FromHexString('#'+bio.water.toString(16).padStart(6,'0'));
  }
  updateBiomeTextures(b);
  if(!init){ gen(); }
}

// 8. SPHERICAL AXIS VIEWPORT NAVIGATION GIZMO
const navCanvas = $('#navCanvas');
const navCtx = navCanvas ? navCanvas.getContext('2d') : null;

function renderSphericalGizmo(){
  if(!navCtx || !orbitCam) return;
  const w = navCanvas.width, h = navCanvas.height;
  navCtx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2, radius = w * 0.36;

  const alpha = orbitCam.alpha, beta = orbitCam.beta;
  const cosA = Math.cos(alpha), sinA = Math.sin(alpha);
  const cosB = Math.cos(beta), sinB = Math.sin(beta);

  function project(vx, vy, vz){
    const x1 = vx * sinA - vz * cosA;
    const z1 = vx * cosA + vz * sinA;
    const y1 = vy;

    const x2 = x1;
    const y2 = y1 * sinB - z1 * cosB;
    const z2 = y1 * cosB + z1 * sinB;
    return { x: cx + x2 * radius, y: cy - y2 * radius, z: z2 };
  }

  const axes = [
    { id:'+X', name:'Right',  vec:[ 1, 0, 0], col:'#ef4444', label:'X', isPos:true,  alpha:0,            beta:Math.PI*0.5 },
    { id:'-X', name:'Left',   vec:[-1, 0, 0], col:'#ef4444', label:'-X',isPos:false, alpha:Math.PI,      beta:Math.PI*0.5 },
    { id:'+Y', name:'Top',    vec:[ 0, 1, 0], col:'#22c55e', label:'Y', isPos:true,  alpha:orbitCam.alpha,beta:0.05 },
    { id:'-Y', name:'Bottom', vec:[ 0,-1, 0], col:'#22c55e', label:'-Y',isPos:false, alpha:orbitCam.alpha,beta:Math.PI-0.05 },
    { id:'+Z', name:'Front',  vec:[ 0, 0, 1], col:'#3b82f6', label:'Z', isPos:true,  alpha:-Math.PI*0.5, beta:Math.PI*0.5 },
    { id:'-Z', name:'Back',   vec:[ 0, 0,-1], col:'#3b82f6', label:'-Z',isPos:false, alpha:Math.PI*0.5,  beta:Math.PI*0.5 }
  ];

  axes.forEach(a => Object.assign(a, project(...a.vec)));
  axes.sort((a, b) => a.z - b.z);

  axes.forEach(a => {
    if(a.isPos){
      navCtx.beginPath();
      navCtx.moveTo(cx, cy);
      navCtx.lineTo(a.x, a.y);
      navCtx.strokeStyle = a.col;
      navCtx.lineWidth = 3.5;
      navCtx.stroke();
    }
  });

  axes.forEach(a => {
    navCtx.beginPath();
    const nodeR = a.isPos ? 13 : 9;
    navCtx.arc(a.x, a.y, nodeR, 0, Math.PI * 2);

    if(a.isPos){
      navCtx.fillStyle = a.col;
      navCtx.fill();
      navCtx.lineWidth = 1.5;
      navCtx.strokeStyle = '#ffffff';
      navCtx.stroke();

      navCtx.fillStyle = '#ffffff';
      navCtx.font = 'bold 11px system-ui, sans-serif';
      navCtx.textAlign = 'center';
      navCtx.textBaseline = 'middle';
      navCtx.fillText(a.label, a.x, a.y);
    } else {
      navCtx.fillStyle = 'rgba(20,25,35,0.7)';
      navCtx.fill();
      navCtx.lineWidth = 2.5;
      navCtx.strokeStyle = a.col;
      navCtx.stroke();
    }
  });

  navCanvas._renderedAxes = axes;
}

$('#navSph').addEventListener('click', e=>{
  const rect = navCanvas.getBoundingClientRect();
  const scale = navCanvas.width / rect.width;
  const mx = (e.clientX - rect.left) * scale;
  const my = (e.clientY - rect.top) * scale;

  if(navCanvas._renderedAxes){
    for(let i = navCanvas._renderedAxes.length - 1; i >= 0; i--){
      const a = navCanvas._renderedAxes[i];
      const dist = Math.hypot(mx - a.x, my - a.y);
      if(dist < 18){
        animateCamera(a.alpha, a.beta);
        msg('Aligned to ' + a.name + ' View (' + a.id + ')');
        break;
      }
    }
  }
});

function animateCamera(targetAlpha, targetBeta){
  const startAlpha = orbitCam.alpha, startBeta = orbitCam.beta;
  const startTime = performance.now();
  const dur = 320;
  function step(t){
    const p = Math.min(1, (t - startTime) / dur);
    const ease = 0.5 - 0.5 * Math.cos(p * Math.PI);
    orbitCam.alpha = lerp(ease, startAlpha, targetAlpha);
    orbitCam.beta = lerp(ease, startBeta, targetBeta);
    renderSphericalGizmo();
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// 9. HYDRAULIC EROSION SIMULATION
function bump(x,z,v){
  const u=cl((x+S/2)/D,0,N-.001), w=cl((z+S/2)/D,0,N-.001), i=u|0, j=w|0, a=u-i, b=w-j, k=j*W+i;
  H[k]+=v*(1-a)*(1-b); H[k+1]+=v*a*(1-b); H[k+W]+=v*(1-a)*b; H[k+W+1]+=v*a*b;
}

function erode(p){
  const n=Math.round(25+75*br.str);
  for(let q=0; q<n; q++){
    const a=R()*Math.PI*2, d=Math.sqrt(R())*br.r;
    let x=p.x+Math.cos(a)*d, z=p.z+Math.sin(a)*d, vx=0, vz=0, sed=0, sp=1;
    for(let t=0; t<28; t++){
      if(Math.abs(x)>S/2-D*2 || Math.abs(z)>S/2-D*2) break;
      const h0=hgt(x,z), gx=(hgt(x+D,z)-hgt(x-D,z))/(2*D), gz=(hgt(x,z+D)-hgt(x,z-D))/(2*D);
      vx=vx*0.5-gx; vz=vz*0.5-gz;
      const l=Math.hypot(vx,vz);
      if(l<1e-4) break;
      vx/=l; vz/=l;
      const nx=x+vx*D, nz=z+vz*D, dh=hgt(nx,nz)-h0, cap=Math.max(-dh,0.03)*sp*6;
      if(sed>cap||dh>0){
        const m=dh>0?Math.min(dh,sed):(sed-cap)*0.3;
        bump(x,z,m); sed-=m;
      } else {
        const m=Math.min((cap-sed)*0.3,-dh);
        bump(x,z,-m*0.5); sed+=m*0.5;
      }
      sp=Math.sqrt(Math.max(sp*sp-dh*2,0.05));
      x=nx; z=nz;
    }
  }
}

// 10. SCULPTING & ZERO-OFFSET CURSOR RAYCASTING
function getFalloff(d, mode){
  if(d>=1) return 0;
  if(mode==='linear') return 1-d;
  if(mode==='sharp') return (1-d)**3;
  if(mode==='flat') return 1;
  return (1-d*d)**2;
}

function sculpt(p, dt){
  if(br.tool==='erode'){
    erode(p);
    updateTerrain();
    return;
  }
  const r=br.r, x0=Math.max(0,Math.floor((p.x+S/2-r)/D)), x1=Math.min(N,Math.ceil((p.x+S/2+r)/D)), z0=Math.max(0,Math.floor((p.z+S/2-r)/D)), z1=Math.min(N,Math.ceil((p.z+S/2+r)/D)), src=br.tool==='smooth'?H.slice():null;
  for(let j=z0; j<=z1; j++){
    for(let i=x0; i<=x1; i++){
      const d=Math.hypot(i*D-S/2-p.x, j*D-S/2-p.z)/r;
      if(d>=1) continue;
      const f=getFalloff(d, br.falloff), k=j*W+i;
      switch(br.tool){
        case'raise': H[k]+=br.str*f*dt*15; break;
        case'lower': H[k]-=br.str*f*dt*15; break;
        case'flat': H[k]+=(fl-H[k])*Math.min(1,f*dt*12*br.str); break;
        case'smooth':{
          const a=(src[k-(i>0)]+src[k+(i<N)]+src[k-(j>0)*W]+src[k+(j<N)*W])/4;
          H[k]+=(a-H[k])*Math.min(1,f*dt*16*br.str); break;
        }
        case'terrace': H[k]+=(Math.round(H[k]/3)*3-H[k])*Math.min(1,f*dt*10*br.str); break;
        case'paint': if(f>0.2) MI[k]=br.tex; break;
      }
    }
  }
  updateTerrain();
}

let painting=false, lastT=0, down=null;
function pickGround(){
  const p = scene.pick(scene.pointerX, scene.pointerY, m => m === terrain);
  return (p && p.hit && p.pickedPoint) ? p.pickedPoint : null;
}

const brushRing = BABYLON.MeshBuilder.CreateTorus('brushRing', {diameter:br.r*2, thickness:0.18, tessellation:32}, scene);
const ringMat = new BABYLON.StandardMaterial('ringMat', scene);
ringMat.emissiveColor = new BABYLON.Color3(0.24, 0.86, 0.58);
ringMat.disableLighting = true;
brushRing.material = ringMat;
brushRing.isPickable = false;

scene.onPointerObservable.add(pi=>{
  if(pi.type===BABYLON.PointerEventTypes.POINTERDOWN){
    down={x:pi.event.clientX, y:pi.event.clientY};
    if(pi.event.button===2 || pi.event.button===1 || pi.event.altKey || nav) return;
    if(tab==='terrain'){
      const p = pickGround();
      if(p){
        push();
        painting=true;
        orbitCam.detachControl(cv);
        fl=p.y;
        lastT=performance.now();
        sculpt(p, 0.04);
      }
    }
  } else if(pi.type===BABYLON.PointerEventTypes.POINTERMOVE){
    renderSphericalGizmo();
    const p = pickGround();
    if(p && !nav && tab==='terrain'){
      brushRing.position.set(p.x, p.y + 0.3, p.z);
      brushRing.scaling.set(br.r/7.0, 1.0, br.r/7.0);
      brushRing.setEnabled(true);
    } else {
      brushRing.setEnabled(false);
    }

    if(!painting) return;
    if(p){
      const t = performance.now();
      if(t-lastT > 30){
        sculpt(p, Math.min(0.06, (t-lastT)/1000));
        lastT=t;
      }
    }
  } else if(pi.type===BABYLON.PointerEventTypes.POINTERUP){
    if(painting){
      painting=false;
      orbitCam.attachControl(cv, true);
    }
  }
});

// Undo / Redo Stack
let hist=[], future=[];
function push(){
  hist.push(H.slice());
  if(hist.length>30) hist.shift();
  future=[];
}
function undo(){
  if(!hist.length) return;
  future.push(H.slice());
  H.set(hist.pop());
  updateTerrain();
}
function redo(){
  if(!future.length) return;
  hist.push(H.slice());
  H.set(future.pop());
  updateTerrain();
}

$('#re').onclick=redo;

function fileBtn(l,acc,cb){
  const d=el(`<label class="chip" style="text-align:center">${l}<input type="file" hidden${acc?' accept="'+acc+'"':''}></label>`);
  d.querySelector('input').onchange=e=>{
    const f=e.target.files[0];
    if(f) cb(f);
    e.target.value='';
  };
  return d;
}

async function importModel(f){
  const url=URL.createObjectURL(f);
  try{
    const r=await BABYLON.SceneLoader.ImportMeshAsync(null,url,'',scene);
    const root=new BABYLON.TransformNode('ImportedModel_' + f.name, scene);
    r.meshes.forEach(m=>{
      m.parent=root; m.receiveShadows=true;
      if(shadow) shadow.addShadowCaster(m,true);
    });
    root.position.y=hgt(0,0);
    objs.push(root);
    msg('Imported '+f.name);
  }catch(e){
    msg('Import failed: '+e.message);
  }finally{
    URL.revokeObjectURL(url);
  }
}

function importHeightmap(f){
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas'); c.width=c.height=W;
      const x=c.getContext('2d');
      x.drawImage(im,0,0,W,W);
      const d=x.getImageData(0,0,W,W).data;
      push();
      for(let k=0; k<W*W; k++) H[k]=(d[k*4]*0.3+d[k*4+1]*0.59+d[k*4+2]*0.11)/255*dem - dem*0.3;
      updateTerrain();
      msg('Heightmap imported');
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
}

function msg(t){
  $('#info').textContent=t;
  setTimeout(()=>{$('#info').textContent=''},4500);
}

// 12. EXPORT TO MAIN WORKSPACE
function buildPayload(){
  return {
    app:'final-effect',
    engine:'babylonjs',
    version:2,
    units:'m',
    terrain:{
      size:S, segments:N,
      heights:Array.from(H),
      biome:biome,
      waterLevel:wl
    },
    water:{level:wl, visible:true},
    foliage:[]
  };
}

function importToGrid(){
  const payload=buildPayload();
  try{
    const host=window.parent!==window?window.parent:window;
    if(host){
      host.postMessage({type:'IMPORT_TERRAIN', payload}, '*');
      host.postMessage({type:'final-effect:import', payload}, '*');
      host.postMessage({type:'final-effect:close-studio'}, '*');
      if(typeof host.FE?.toast==='function'){
        host.FE.toast('Imported Babylon.js Landscape into Main Workspace!');
      }
    }
  }catch(e){
    console.warn('Import error:', e);
  }
}

$('#imp').onclick=importToGrid;
window.importToMainGrid=importToGrid;
window.importToGrid=importToGrid;

$('#bw').onclick=()=>{
  const payload=buildPayload();
  $('#exp').value=JSON.stringify(payload,null,2);
  $('#ov').hidden=false;
};
$('#cl').onclick=()=>$('#ov').hidden=true;
$('#cp').onclick=()=>{
  const t=$('#exp'); t.select();
  navigator.clipboard.writeText(t.value);
  $('#cp').textContent='Copied!';
  setTimeout(()=>$('#cp').textContent='Copy JSON',1400);
};

// Shading Mode Switcher
$('#sh').innerHTML='<button class="on" data-mode="render">Render</button><button data-mode="solid">Solid</button><button data-mode="wire">Wire</button>';
$('#sh').addEventListener('click', e=>{
  if(e.target.dataset.mode){
    mode=e.target.dataset.mode;
    document.querySelectorAll('#sh button').forEach(b=>b.classList.toggle('on',b===e.target));
    shade();
    scene.clearColor=mode==='render'?new BABYLON.Color4(0.48, 0.68, 0.88, 1):new BABYLON.Color4(0.24, 0.24, 0.24, 1);
  }
});

// Render Loop
let lastFpsTime=performance.now(), frameCount=0;
engine.runRenderLoop(()=>{
  scene.render();
  renderSphericalGizmo();
  frameCount++;
  const now=performance.now();
  if(now-lastFpsTime>=500){
    $('#fps').textContent=Math.round((frameCount*1000)/(now-lastFpsTime))+' fps';
    frameCount=0;
    lastFpsTime=now;
  }
});

addEventListener('resize', ()=>engine.resize());

// Keyboard Shortcuts
window.addEventListener('keydown', e=>{
  if(e.key==='z'&&(e.ctrlKey||e.metaKey)){ if(e.shiftKey) redo(); else undo(); }
  else if(e.key==='y'&&(e.ctrlKey||e.metaKey)) redo();
});

// Initialize scene with Restored Procedural Terrain & Direct PBR Textures
setBiome('hills', true);
gen();
updSky();
setTab('terrain');
showPanel(false);
renderSphericalGizmo();
