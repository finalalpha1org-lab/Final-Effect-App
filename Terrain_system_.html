(function (root, factory) {

  if (typeof module === "object" && module.exports) module.exports = api;
  else root.CelestialMath = api;
})(globalThis, function () {
  const DEG = Math.PI / 180;
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

  function cartesianFromSpherical(body) {
    const distance = Math.max(Number(body.dist) || 100, 5);
    const elevation = (Number(body.el) || 0) * DEG;
    const azimuth = (Number(body.az) || 0) * DEG;
    return [
      distance * Math.cos(elevation) * Math.cos(azimuth),
      distance * Math.sin(elevation),
      distance * Math.cos(elevation) * Math.sin(azimuth),
    ];
  }

  function setFromCartesian(body, x, y, z) {
    const apparentSize = body.size;
    const distance = Math.max(Math.hypot(x, y, z), 5);
    body.dist = distance;
    body.el = Math.asin(clamp(y / distance, -1, 1)) / DEG;
    body.az = (Math.atan2(z, x) / DEG + 360) % 360;
    body.size = apparentSize;
    return body;
  }

  function angularRadius(body) {
    return Math.max(0, Number(body.size) || 0) * DEG;
  }

  return Object.freeze({ cartesianFromSpherical, setFromCartesian, angularRadius });
});

<script>
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.ScatterSpacing = api;
})(globalThis, function () {
  const radius = (value) => Math.max(0, Number(value) || 0);
  function requiredDistance(radiusA, radiusB, sameSpacingClass, extraGap = 0) {
    const sum = radius(radiusA) + radius(radiusB);
    return sameSpacingClass ? sum + radius(extraGap) : sum * 0.9;
  }
  function overlaps(dx, dz, radiusA, radiusB, sameSpacingClass, extraGap = 0) {
    const minDistance = Math.max(0, requiredDistance(radiusA, radiusB, sameSpacingClass, extraGap) - 1e-6);
    return dx * dx + dz * dz < minDistance * minDistance;
  }
  return Object.freeze({ requiredDistance, overlaps });
});
