name: Temporary one-time Final Effect source sync
on:
  push:
    branches:
      - main
    paths:
      - sync-payload-trigger/READY
permissions:
  contents: write
jobs:
  assemble-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: final-effect-sync-qwn7tnwv
          path: payload
      - uses: actions/checkout@v6
        with:
          ref: main
          path: target
      - name: Assemble files and commit directly to main
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          from pathlib import PurePosixPath
          payload = pathlib.Path("payload/sync-payload")
          target = pathlib.Path("target")
          manifest = json.loads((payload / "manifest.json").read_text(encoding="utf-8"))
          for item in manifest["files"]:
              rel = PurePosixPath(item["path"])
              if rel.is_absolute() or ".." in rel.parts or rel.as_posix() in {".env", ".env.example"}:
                  raise SystemExit("Unsafe or secret file path refused")
              key = PurePosixPath(item["key"])
              if key.is_absolute() or ".." in key.parts:
                  raise SystemExit("Unsafe payload key refused")
              folder = payload.joinpath(*key.parts)
              chunks = sorted(folder.glob("part-*.txt"))
              if len(chunks) != item["parts"]:
                  raise SystemExit(f"Chunk count mismatch for {rel}")
              content = b"".join(part.read_bytes() for part in chunks)
              if len(content) != item["utf8Bytes"]:
                  raise SystemExit(f"Byte count mismatch for {rel}")
              dest = target.joinpath(*rel.parts)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(content)
              subprocess.run(["git", "-C", "target", "add", "--", rel.as_posix()], check=True)
          PY
          git -C target rm -- .github/workflows/one-time-final-effect-sync-main.yml sync-payload-trigger/READY
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target commit -m "Sync current Final Effect 3D source"
          git -C target push origin HEAD:main
          git -C target push origin --delete final-effect-sync-qwn7tnwv
