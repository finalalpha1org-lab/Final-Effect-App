name: Build & Test C++20 Core Engine (Native + WASM)

on:
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-cpp-core.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  cpp-core-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build & run native C++20 Core Engine unit tests
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --parallel 2
          ctest --test-dir build-native --output-on-failure

      - name: Compile freestanding WebAssembly artifact via Clang/Zig
        run: |
          pip install ziglang
          python3 -m ziglang c++ -std=c++20 -O3 -fno-builtin -target wasm32-freestanding -nostdlib \
            -fno-exceptions -fno-rtti \
            -Wl,--no-entry -Wl,--export-dynamic -Wl,--export-memory -Wl,--export=__heap_base -Wl,--export=__wasm_call_ctors \
            cpp/src/fe_wasm_exports.cpp \
            cpp/src/fe_animation.cpp \
            cpp/src/fe_renderer.cpp \
            cpp/src/fe_sculpt_touch.cpp \
            cpp/src/fe_simulation.cpp \
            cpp/src/fe_landscape.cpp \
            -o wasm/fe_core_engine.wasm
          cp wasm/fe_core_engine.wasm ./fe_core_engine.wasm
          node scripts/build-cpp-wasm.mjs
