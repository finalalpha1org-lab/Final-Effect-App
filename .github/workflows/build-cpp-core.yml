name: Build & Test C++20 Core Engine (Native + WASM)

on:
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-cpp-core.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  cpp-core-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build & run native C++20 Core Engine unit tests
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --parallel 2
          ctest --test-dir build-native --output-on-failure

      - name: Compile freestanding WebAssembly artifact via Clang/Zig
        run: |
          # Build through the canonical script: it compiles *every* source file
          # and validates the required export list, so a partial source list can
          # never ship an engine that is missing the modifier/ocean/volume ABI.
          pip install ziglang
          python3 -m ziglang version
          node scripts/build-cpp-wasm.mjs
