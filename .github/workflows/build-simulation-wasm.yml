name: Build simulation solver WASM

on:
  push:
    branches:
      - main
      - wasm-physics-solver
    paths:
      - 'wasm/simulation_solver.rs'
      - 'wasm/ABI.md'
      - '.github/workflows/build-simulation-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout solver branch
        uses: actions/checkout@v6
        with:
          ref: wasm-physics-solver

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run native numerical-kernel tests
        run: |
          rustc --edition=2021 --test wasm/simulation_solver.rs -O -o /tmp/simulation-solver-tests
          /tmp/simulation-solver-tests

      - name: Compile WASM module
        run: |
          rustc --edition=2021 --target wasm32-unknown-unknown --crate-type cdylib \
            -C opt-level=3 -C panic=abort \
            -C link-arg=--export-memory \
            -C link-arg=--export=__heap_base \
            wasm/simulation_solver.rs -o wasm/simulation_solver.wasm
          python3 - <<'PY'
          from pathlib import Path
          binary = Path('wasm/simulation_solver.wasm').read_bytes()
          assert binary[:4] == b'\x00asm', 'invalid WebAssembly magic header'
          assert len(binary) > 8, 'empty WebAssembly module'
          print(f'WASM module validated: {len(binary)} bytes')
          PY
          base64 -w0 wasm/simulation_solver.wasm > wasm/simulation_solver.wasm.b64

      - name: Commit generated browser artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wasm/simulation_solver.wasm wasm/simulation_solver.wasm.b64
          if ! git diff --cached --quiet; then
            git commit -m '[wasm-build] Generate simulation solver artifact'
            git push origin wasm-physics-solver
          fi
