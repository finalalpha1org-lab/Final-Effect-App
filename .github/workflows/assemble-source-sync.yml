name: One-time full source sync

on:
  push:
    branches: [main]
    paths:
      - '.sync-trigger.json'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble checked source archive from staging branch
        env:
          STAGING_BRANCH: sync-final-effect-source-2026-10-21
          EXPECTED_SHA256: 86df11d79fa57c8f900cf718d410192e1d346a942c24f4265fb9d05e8d12a2b5
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
          mkdir -p /tmp/source-sync
          : > /tmp/source-sync/payload.b64
          for i in $(seq 0 41); do
            n=$(printf '%03d' "$i")
            git show "origin/$STAGING_BRANCH:.sync/final-effect-source/part-$n.txt" >> /tmp/source-sync/payload.b64
          done
          base64 --decode /tmp/source-sync/payload.b64 > /tmp/source-sync/final-effect-source.zip
          actual=$(sha256sum /tmp/source-sync/final-effect-source.zip | cut -d' ' -f1)
          test "$actual" = "$EXPECTED_SHA256"
          python3 - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          z = ZipFile('/tmp/source-sync/final-effect-source.zip')
          entries = z.infolist()
          assert len(entries) == 76, f'expected 76 project files, found {len(entries)}'
          for info in entries:
              p = PurePosixPath(info.filename)
              assert not p.is_absolute() and '..' not in p.parts, f'unsafe path: {info.filename}'
              assert p.parts and p.parts[0] not in {'.env', '.camelai', '.github', '.sync'}, f'forbidden path: {info.filename}'
              assert not p.name.startswith('.env'), f'env file prohibited: {info.filename}'
              mode = info.external_attr >> 16
              assert (mode & 0o170000) != 0o120000, f'symlink prohibited: {info.filename}'
          assert 'index.html' in z.namelist() and 'Terrain_system_.html' in z.namelist()
          z.testzip() is None or (_ for _ in ()).throw(AssertionError('corrupt source archive'))
          print(f'Validated {len(entries)} source files')
          PY
          unzip -oq /tmp/source-sync/final-effect-source.zip -d .

      - name: Commit complete project source to main and remove temporary sync files
        env:
          STAGING_BRANCH: sync-final-effect-source-2026-10-21
        run: |
          set -euo pipefail
          rm -f .sync-trigger.json .github/workflows/assemble-source-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync complete Final Effect 3D project source'
          git push origin HEAD:main
          git push origin --delete "$STAGING_BRANCH"
