addEventListener('message',e=>{
  const d=e.data;

    parseModel(d.buffer,(d.name||'x.glb').split('.').pop().toLowerCase(),d.name||'host-model.glb');
  } else if(d.type==='TOGGLE_TERRAIN_PANEL'||d.type==='TOGGLE_PANEL'){
    showPanel(!panelOpen);
    if(panelOpen)build();
  } else if(d.type==='OPEN_TERRAIN_PANEL'){

    build();
  } else if(d.type==='OPEN_3D_MAP_MODAL'||d.type==='OPEN_IMPORT'){
    setTab('import');

    else if(d.mode==='navigate'){nav=true;setNav();}
    else if(d.mode==='paint'){tab='terrain';bt='terrain';br.tool='paint';nav=false;showPanel(true);build();}
  } else if(d.type==='SET_SHADING'&&d.shading){
    mode=d.shading==='wireframe'?'wire':(d.shading==='rendered'?'render':'solid');
    syncMode();
  } else if(d.type==='RESTORE_LANDSCAPE'&&d.payload){
    const p = d.payload;
    if(p.terrain && p.terrain.heights){
      const bstr = atob(p.terrain.heights);
      const buf = new ArrayBuffer(bstr.length);
      const view = new Uint8Array(buf);
      for(let i=0;i<bstr.length;i++) view[i]=bstr.charCodeAt(i);
      H.set(new Float32Array(buf));
      if(p.terrain.materials){
        const mb = atob(p.terrain.materials);
        const mbuf = new ArrayBuffer(mb.length);
        const mview = new Uint8Array(mbuf);
        for(let i=0;i<mb.length;i++) mview[i]=mb.charCodeAt(i);
        MI.set(new Uint8Array(mbuf));
      }
      upd();
    }
    if(p.foliage && p.foliage.kinds){
      for(const k in p.foliage.kinds){
        if(!KIND[k]) continue;
        const it = p.foliage.kinds[k];
        if(!it || !it.data) continue;
        const bstr = atob(it.data);
        const buf = new ArrayBuffer(bstr.length);
        const view = new Uint8Array(buf);
        for(let i=0;i<bstr.length;i++) view[i]=bstr.charCodeAt(i);
        KIND[k].list = dec(new Float32Array(buf));
        if(it.tint) KIND[k].tint = it.tint;
        sync(k);
      }
    }
    showPanel(true);
    build();
  }

const brushTab=()=>(bt=='terrain'||bt=='plants'||bt=='city'&&!cityTap);
function setNav(){const p=brushTab()&&!nav;oc.mouseButtons={LEFT:p?-1:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.ROTATE,RIGHT:THREE.MOUSE.PAN};oc.touches={ONE:p?-1:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
$('#mode').style.display='';$('#mode').textContent=nav?'✋ Orbit':'🖌 Brush';$('#mode').classList.toggle('on',!nav)}
const ring=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(Array.from({length:64},(_,i)=>new THREE.Vector3(Math.cos(i/64*6.283),0,Math.sin(i/64*6.283)))),new THREE.LineBasicMaterial({color:0xffffff,depthTest:false,transparent:true}));
ring.renderOrder=9;ring.visible=false;scene.add(ring);
function setTab(id){tab=id;place=null;select(null);ring.visible=false;if(id=='city'&&!BLD[br.kind]&&br.kind!='erase')br.kind='house';if(id=='plants'&&BLD[br.kind])br.kind='grass';if(id=='terrain'||id=='plants'||id=='city'){bt=id;nav=false}else nav=true;panelOpen=true;$('#panel').hidden=false;$('#bg').classList.add('on');[...$('#tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.id==id));setNav();build()}
[['wire','Wire'],['solid','Solid'],['render','Render']].forEach(([id,l])=>{const b=el(`<button class="${id==mode?'on':''}">${l}</button>`);b.onclick=()=>{mode=id;[...$('#sh').children].forEach(c=>c.classList.toggle('on',c===b));shade()};$('#sh').append(b)});
$('#mode').onclick=()=>{nav=!nav;setNav()};
const b64=a=>{const u=new Uint8Array(a.buffer);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
function importToGrid(){const f={};for(const k in KIND){const K=KIND[k];f[k]={count:K.list.length,size:K.size,tint:K.tint,data:b64(enc(K.list))}}
const d={app:'final-effect',version:1,units:'m',axes:{up:'Y',note:'data is three.js Y-up; the UI shows Blender-style Z-up'},
terrain:{size:S,segments:N,vertexCount:W*W,heights:b64(H),materials:b64(MI),colors:b64(C.array),materialNames:['grass','dirt','rock','sand','snow'],palette:PAL,biome,heightScale:hs,rockSlope:rockT,snowLine:snowL,roughness:tm.roughness,normalStrength:tm.normalScale.x},
water:{level:wl,visible:water.visible,waveHeight:U.amp.value,palette:wp},
sky:{timeOfDay:tod,sunAngle:az,clouds:cov,fog:fogD,sunColor:sun.color.getHex(),sunIntensity:sun.intensity,sunPosition:sun.position.toArray(),hemiSkyColor:hemi.color.getHex(),hemiGroundColor:hemi.groundColor.getHex(),hemiIntensity:hemi.intensity,fogColor:scene.fog.color.getHex()},lighting:{sun:{color:sun.color.getHex(),intensity:sun.intensity,position:sun.position.toArray()},hemi:{skyColor:hemi.color.getHex(),groundColor:hemi.groundColor.getHex(),intensity:hemi.intensity}},pointLights:objs.flatMap(o=>{const l=[];o.traverse(c=>{if(c.isPointLight)l.push({color:c.color.getHex(),intensity:c.intensity,distance:c.distance,position:c.getWorldPosition(new THREE.Vector3()).toArray()})});return l}),
foliage:{layout:'float32 x7 per instance: x,y,z,scale,rotY,aspect,brightness',kinds:f},
map:mapRoot?{name:mapName,scale:mapBase*mapK,rotationDeg:mapR,y:mapRoot.position.y}:null,objects:objs.map(o=>({type:o.userData.n.split('.')[0],name:o.userData.n,position:o.position.toArray(),quaternion:o.quaternion.toArray(),scale:o.scale.toArray(),colors:tints(o).map(m=>m.material.color.getHexString())}))};
const js=JSON.stringify(d),host=window.parent!==window?window.parent:window.opener;let sent=false;
try{if(host){host.postMessage({type:'final-effect:import',payload:d},'*');host.postMessage({type:'IMPORT_TERRAIN',payload:d},'*');sent=true}}catch(e){}
$('#exp').value=js;$('#ovt').textContent=(sent?'Posted to the embedding app (postMessage "final-effect:import"). ':'Not embedded, so nothing was posted. ')+'Scene data, '+Math.round(js.length/1024)+' KB:';$('#ov').hidden=false}
$('#imp').onclick=importToGrid;
$('#cp').onclick=()=>{const t=$('#exp');t.focus();t.select();t.setSelectionRange(0,1e9);try{navigator.clipboard.writeText(t.value)}catch(e){}try{document.execCommand('copy')}catch(e){}};
$('#cl').onclick=()=>$('#ov').hidden=true;
/* pointer input */
const ray=new THREE.Raycaster(),m2=new THREE.Vector2(),ptrs=new Set();let down=null,painting=false,lastT=0;
function pick(e,o){const r=cv.getBoundingClientRect();m2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(m2,cam);return ray.intersectObjects(o,true)[0]}
const root=o=>{while(o.parent&&o.parent!==scene)o=o.parent;return o};
const apply=(p,dt)=>bt=='terrain'?sculpt(p,dt):plantAt(p);
function tap(e){if(bt=='city'&&cityTap&&!nav&&tab!='obj'){const h=pick(e,[ter]);if(h)genCity(h.point);return}if(place){const h=pick(e,[ter]);if(h){const o=LIB[place]();o.userData.n=nm(place);o.position.copy(h.point);o.rotation.y=R()*6.28;push();scene.add(o);objs.push(o);shade();select(o)}return}
const h=pick(e,objs);select(h?root(h.object):null)}
cv.oncontextmenu=e=>e.preventDefault();
cv.addEventListener('pointerdown',e=>{ptrs.add(e.pointerId);if(ptrs.size>1){painting=false;down=null;return}down={x:e.clientX,y:e.clientY};
if(brushTab()&&!nav&&e.button!==2){const h=pick(e,[ter]);if(h){painting=true;push();fl=h.point.y;lastT=performance.now();apply(h.point,.03)}}});
cv.addEventListener('pointermove',e=>{if(!brushTab()||nav||!(painting||e.pointerType=='mouse'))return;const h=pick(e,[ter]);ring.visible=!!h;if(!h)return;
ring.position.set(h.point.x,h.point.y+.3,h.point.z);ring.scale.setScalar(br.r);
const t=performance.now();if(painting&&t-lastT>30){apply(h.point,Math.min(.06,(t-lastT)/1000));lastT=t}});
cv.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(e.pointerType!='mouse')ring.visible=false;if(painting){painting=false;if(tab=='terrain')resnap()}
if(down&&((panelOpen&&tab=='obj')||(bt=='city'&&cityTap&&!nav))&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6&&!tc.dragging&&!tc.axis)tap(e);down=null});
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);painting=false});
const ptD=new Set();
window.addEventListener('pointerdown',e=>{if(e.target!==cv)return;ptD.add(e.pointerId);if(!mo&&!tc.dragging)oc.enabled=!(brushTab()&&!nav&&ptD.size===1)},true);
const ptU=e=>{ptD.delete(e.pointerId);if(!ptD.size&&!mo&&!tc.dragging)oc.enabled=true};
window.addEventListener('pointerup',ptU,true);window.addEventListener('pointercancel',ptU,true);
window.addEventListener('touchstart',e=>{if(e.target===cv&&brushTab()&&!nav&&!mo&&e.touches.length===1)e.stopPropagation()},{capture:true,passive:true});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
/* loop */
let pt=performance.now(),fc=0,ft=0;
function loop(){requestAnimationFrame(loop);const n=performance.now(),dt=Math.min(.1,(n-pt)/1000);pt=n;U.t.value+=dt*wspd;WU.value+=dt;U.wy.value=water.position.y;if(++fr==20||fr==150)checkShaders();if(envDirty&&performance.now()-envT>500){envDirty=false;envT=performance.now();buildEnv()}
clouds.forEach(g=>{g.position.x+=dt*2;if(g.position.x>260)g.position.x=-260});
oc.update();if(sel)sbx.setFromObject(sel);nfs.forEach(f=>f());navg();ren.render(scene,cam);fc++;ft+=dt;if(ft>.5){$('#fps').textContent=Math.round(fc/ft)+' fps';fc=ft=0}}
[()=>gen(),()=>scatter(),()=>updSky(),()=>setTab('terrain'),()=>showPanel(false),()=>{nav=true;setNav()}].forEach(f=>{try{f()}catch(e){showErr('Init: '+e.message)}});loop();
</script></body></html>
